# benchmarks/image.lock
#
# Pinned image and library versions for the reference benchmark
# environment. The library tarballs are pinned by full sha256 inside
# `Containerfile` and re-asserted here as a single source of truth — a
# mismatch between the two is a build-time failure (`sha256sum -c`).
#
# `[base].digest` is filled in (resolved 2026-04-26 against the Docker
# Hub registry API). `[image].local_id` is per-host under -march=native
# and is stamped automatically by `run.sh` after each successful build,
# so it acts as a drift tripwire — the lead can compare future builds
# against the recorded id, and a divergence means the host environment
# changed.
#
# Refresh procedure (e.g. picking a newer Debian dated tag):
#   1. Fetch the new tag's digest:
#        curl -sH 'Accept: application/vnd.oci.image.index.v1+json' \
#             -H "Authorization: Bearer $(curl -s 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/debian:pull' | jq -r .token)" \
#             "https://registry-1.docker.io/v2/library/debian/manifests/<NEW_TAG>" \
#             -D - 2>/dev/null | grep -i docker-content-digest
#   2. Update both [base].tag/[base].digest here AND the matching
#      Containerfile FROM line; `run.sh` cross-checks them.
#   3. podman build -t gf2-bench:ref -f benchmarks/Containerfile benchmarks/
#   4. ./benchmarks/run.sh — stamps [image].local_id automatically.

[image]
name = "gf2-bench"
tag  = "ref"
# `local_id` is intrinsically per-build because `-march=native` couples
# the binary to the host microarchitecture; recording it gives the gate
# a tripwire for "did anything change since we last validated?".
local_id = "sha256:TODO_FILL_AFTER_FIRST_BUILD"

[base]
repository = "docker.io/library/debian"
tag        = "bookworm-20260421-slim"
# Resolved 2026-04-26 against docker.io/library/debian via the registry
# API (OCI image index). The `Containerfile` FROM line carries the same
# digest as defence in depth against registry mutation / mirror
# substitution.
digest     = "sha256:f9c6a2fd2ddbc23e336b6257a5245e31f996953ef06cd13a59fa0a1df2d5c252"

[libs.gcc]
version = "12.2.0-14"
