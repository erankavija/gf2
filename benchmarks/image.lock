# benchmarks/image.lock
#
# Pinned image and library versions for the reference benchmark
# environment. The library tarballs are pinned by full sha256 inside
# `Containerfile` and re-asserted here as a single source of truth — a
# mismatch between the two is a build-time failure (`sha256sum -c`).
#
# Two slots remain to be filled in on first build:
#
#   [base].digest       — the registry digest of `debian:bookworm-20260421-slim`
#                         at first-pull time. Until this is filled in,
#                         only the dated tag pin protects us. See the
#                         `TODO_DIGEST` comment in `Containerfile`.
#
#   [image].local_id    — the content-addressable id of the locally built
#                         image. Per-build, intrinsically per-host
#                         because the host's CPU microarchitecture
#                         affects the binary layout under -march=native.
#                         The lead records this on the dev-host run and
#                         the gate can compare future builds against it.
#
# Update procedure:
#   1. podman build -t gf2-bench:ref -f benchmarks/Containerfile benchmarks/
#   2. podman image inspect gf2-bench:ref --format '{{.Id}}'
#         → paste into [image].local_id
#   3. podman image inspect docker.io/library/debian:bookworm-20260421-slim \
#         --format '{{(index .RepoDigests 0)}}'
#         → paste into [base].digest (sha256:... portion only)
#   4. Re-run `./benchmarks/run.sh` and verify the build reproduces the
#      same local_id. Drift means the host environment changed.

[image]
name = "gf2-bench"
tag  = "ref"
# `local_id` is intrinsically per-build because `-march=native` couples
# the binary to the host microarchitecture; recording it gives the gate
# a tripwire for "did anything change since we last validated?".
local_id = "sha256:TODO_FILL_AFTER_FIRST_BUILD"

[base]
repository = "docker.io/library/debian"
tag        = "bookworm-20260421-slim"
# Resolved 2026-04-26 against docker.io/library/debian via the registry
# API (OCI image index). The `Containerfile` FROM line carries the same
# digest as defence in depth against registry mutation / mirror
# substitution.
digest     = "sha256:f9c6a2fd2ddbc23e336b6257a5245e31f996953ef06cd13a59fa0a1df2d5c252"

[libs.gcc]
version = "12.2.0-14"
source  = "debian-bookworm-apt"

