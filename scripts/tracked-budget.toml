# Limits for scripts/check-tracked-budget.py. The numbers may only fall.
max_file_bytes = 1048576
max_commit_added_bytes = 5242880
max_tree_bytes = 34040000

forbidden_paths = [
  '(^|/)(inputs|source-inputs|test-logs)/',
  '\.(log|err|zst|data|tar\.gz|tgz|tar\.xz)$',
  '(^|/)perf\.data',
  '(^|/)[^/]*receipts?[^/]*\.(json|md|txt|csv|tsv|yaml|yml|toml)$',
  '(^|/)outcomes?[^/]*\.(json|md|txt|csv|tsv|yaml|yml|toml)$',
  '\.(out|stdout|stderr)(\.[^/]*)?$',
  '(^|/)(stdout|stderr|output|timeline|scope)[^/]*\.txt$',
  '^dev/(active|research)/(?!.*(\.(md|py|rs|sh|h|g|toml|lock)|/progress\.json|/[^/]*breakdown\.json)$)',
  '^dev/studies/',
  '^experiments/[^/]+/results/',
  '(^|/)(execution|journal)[^/]*\.(log|jsonl|txt|csv|tsv)$',
  '^dev/(bench_results|benchmarks|simulation_results|archive)/',
  '\.asm\.txt$',
]

# A JSON document the rules above admit under `record_documents` holds workflow
# state, such as statuses and `started_at`/`completed_at`. A member whose whole
# name matches one of `record_members` makes it an execution record: when a run
# happened or ended, what it cost, which executable ran, its exit status, or its
# receipt.
record_documents = '^dev/(active|research)/.*\.json$'
record_members = [
  '(ran|ended|fired)_at',
  '(wall|cpu|run|elapsed)_(seconds|secs|ms|time)',
  '(elapsed|duration)(_\w+)?',
  '(\w+_)?(sha256|digest)',
  '(\w+_)?(binary|executable)(_\w+)?',
  '(\w+_)?receipts?',
  'exit_(status|code)(_\w+)?',
  '(peak|max)_rss(_\w+)?',
]
[[exception]]
path = "dev/reference_data/osd_ebch_128_64_fossorier1994_digitization/*"
reason = "digitization of published figures, not a measurement of this code"

[[exception]]
path = "experiments/*/tests/fixtures/*"
reason = "behavioral test fixtures"

[[exception]]
path = ".jit/events.jsonl"
reason = "append-only tracker log; grows with the tracker"

[[exception]]
path = "crates/*/tests/compile_fail/*.stderr"
reason = "expected compiler diagnostics of the trybuild tests"
