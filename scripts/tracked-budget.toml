# Limits for scripts/check-tracked-budget.py. The numbers may only fall; a
# change of max_tree_bytes sets it to the measured tree plus tree_headroom_bytes.
max_file_bytes = 1048576
max_commit_added_bytes = 5242880
max_tree_bytes = 20873635
tree_headroom_bytes = 262144

forbidden_paths = [
  '(^|/)(inputs|source-inputs|test-logs)/',
  '\.(log|err|zst|data|tar\.gz|tgz|tar\.xz)$',
  '(^|/)perf\.data',
  '(^|/)[^/]*receipts?[^/]*\.(json|md|txt|csv|tsv|yaml|yml|toml)$',
  '(^|/)outcomes?[^/]*\.(json|md|txt|csv|tsv|yaml|yml|toml)$',
  '\.(out|stdout|stderr)(\.[^/]*)?$',
  '(^|/)(stdout|stderr|output|timeline|scope)[^/]*\.txt$',
  '^dev/(active|research)/(?!.*(\.(md|py|rs|sh|h|hip|g|toml|lock)|/progress\.json|/[^/]*breakdown\.json)$)',
  '^dev/studies/',
  '^experiments/[^/]+/results/',
  '(^|/)(execution|journal)[^/]*\.(log|jsonl|txt|csv|tsv)$',
  # Execution streams, ledgers, run shards and pooled result records.
  '\.jsonl$',
  '(^|/)runs\.json$',
  '(^|/)summary\.(csv|tsv)$',
  '^dev/(bench_results|benchmarks|simulation_results|archive)/',
  '\.asm\.txt$',
  # A TOML file under dev/active is a frozen run configuration unless it is
  # a build or tool manifest.
  '^dev/active/(?!(.*/)?(Cargo|rust-toolchain|rustfmt|clippy|deny|pyproject|lakefile|nextest)\.toml$).*\.toml$',
  # The tracker is its own repository, mounted at .jit/.
  '^\.jit/',
]

# A JSON, TOML or YAML document the rules above admit under `record_documents` holds
# configuration or workflow state, such as statuses and
# `started_at`/`completed_at`. A member whose whole name matches one of
# `record_members` makes it an execution record: when a run happened or ended,
# what it cost or measured, on which host, and its exit status or verdict. Under
# `workflow_documents`, where nothing pins a configuration, a member matching
# `workflow_record_members` does too: which executable ran, its digest, or its
# receipt. Elsewhere such a member is a configuration pin.
record_documents = '.*\.(json|toml|yaml|yml)$'
record_members = [
  '(ran|ended|fired|measured)_at',
  '(wall|cpu|run|elapsed)_(seconds|secs|ms|time)',
  '(elapsed|duration)(_\w+)?',
  'wall_clock(_\w+)?',
  '(median|mean|min|max|p\d+)_(ns|us|ms|s|seconds)',
  'throughput(_\w+)?',
  'exit_(status|code)(_\w+)?',
  '(peak|max)_rss(_\w+)?',
  'host',
  'passed',
]
workflow_documents = '^dev/(active|research)/'
workflow_record_members = [
  '(\w+_)?(sha256|digest)',
  '(\w+_)?(binary|executable)(_\w+)?',
  '(\w+_)?receipts?',
]

# A Markdown document under `markdown_documents` is prose: a design, a plan, a
# handoff. It is a receipt when its first heading or front matter `title`
# matches `receipt_title`, or when a `name: value` line records a
# `record_members` member with a literal value (a digest, a number or a
# timestamp). It holds a result table when a header cell names one of
# `measurement_columns` and most body cells under it are numeric. The columns
# name what a run measures: elapsed time, processor time, rate, compiler
# resource allocation, cycle counts and memory peaks. Sizes and counts that
# design arithmetic derives, such as bytes per lane or code lines, are left out.
markdown_documents = '.*\.md$'
receipt_title = '\b(receipts?|run records?|results|measurements)\b'
measurement_columns = [
  'time', 'times', 'wall(_\w+)?', 'wall[- ]clock', 'cpu(_\w+)?', 'runtime', 'elapsed', 'duration', 'latency',
  'ns', 'us', 'µs', 'ms', 'seconds', 'throughput(_\w+)?', '[GMK]i?B/s', '[GM]elem/s', '[GM]?ops/s', 'Gops',
  'speedup', 'cycles', 'VGPRs?', 'SGPRs?', 'spills?', 'scratch', 'LDS', 'occupancy', 'rss', 'peak memory',
  'BER', 'BLER', 'FER', 'frames', 'errors', 'passed',
]

# A CSV or TSV table under `table_documents` is a result table when a header
# cell names one of `measurement_columns`.
table_documents = '.*\.(csv|tsv)$'
