# Exceptions for scripts/check-references.py. Each entry needs a reason.

[[exception]]
path = ".jit/events.jsonl"
reason = "append-only tracker log records paths as they were"

[[exception]]
path = ".jit/issues/*"
planned = ["crates/", "experiments/", "docs/", "scripts/", "benchmarks/", "proofs/"]
reason = "open issues name files they plan to create"

[[exception]]
path = "contrib/gates/tests/*"
reason = "fixtures of the documentation check"

[[exception]]
path = "scripts/check-references.py"
reason = "its self-test names unresolvable paths"

[[exception]]
path = "scripts/check-tracked-budget.py"
reason = "its self-test names the paths it must refuse"

[[exception]]
path = "packages/*"
reason = "installable rule packs name paths of the projects that adopt them"

[[exception]]
path = "dev/active/b8206228-permanent-statistics/45ecf975/*"
reason = "history rewrite runbook names the paths it strips; remove when 45ecf975 closes"

[[exception]]
path = "crates/gf2-coding/data/ldpc/nr_5g/PROVENANCE.md"
reason = "cites files of the upstream Sionna repository"

[[exception]]
path = ".agents/skills/*"
reason = "skill text gives illustrative paths of the projects that use it"

[[exception]]
path = "scripts/tracked-budget.toml"
reason = "names the locations it forbids"

[[exception]]
path = "dev/tools/tuning-campaign-support/tests/protocol_contracts.rs"
reason = "creates the named path in a temporary repository"

[[exception]]
path = "proofs/lake-manifest.json"
reason = "Lake writes it; `subDir` names a directory inside the upstream repository at `url`"
