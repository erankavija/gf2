# Exceptions for scripts/check-references.py. Each entry needs a reason.
# `path` is a glob or a list of globs.

[[exception]]
path = ".jit/events.jsonl"
reason = "append-only tracker log records paths as they were"

[[exception]]
path = ".jit/issues/*"
history = "closed"
reason = "a closed issue's prose is history: it may name evidence and invariants the tree no longer holds"

[[exception]]
path = ".jit/issues/*"
planned = ["crates/", "experiments/", "docs/", "scripts/", "benchmarks/", "proofs/"]
reason = "open issues name files they plan to create"

[[exception]]
path = ".jit/archive-evidence/*"
reason = "archive records of completed containers state the paths their documents moved from and to"

[[exception]]
path = ".jit/references.toml"
reason = "citations name files inside the cited upstream sources"

[[exception]]
path = "dev/reference_data/osd_ebch_128_64_fossorier1994.md"
reason = "provenance record names the retrieved upstream file"

[[exception]]
path = "dev/active/ae03bcd0-general-bch/oracle-provenance.md"
reason = "names the package metadata file of the GAP installations the oracle loads"

[[exception]]
path = "contrib/gates/tests/*"
reason = "fixtures of the documentation check"

[[exception]]
path = "scripts/check-references.py"
reason = "its self-test names unresolvable paths"

[[exception]]
path = "scripts/check-tracked-budget.py"
reason = "its self-test names the paths it must refuse"

[[exception]]
path = "packages/*"
reason = "installable rule packs name paths of the projects that adopt them"

[[exception]]
path = [
  "dev/active/b8206228-permanent-statistics/45ecf975/history-rewrite-runbook.md",
  "dev/active/b8206228-permanent-statistics/45ecf975/rewrite_paths.py",
]
reason = "history rewrite runbook and its path filter name the paths and backups the rewrite handles; remove when 45ecf975 closes"

[[exception]]
path = "crates/gf2-coding/data/ldpc/nr_5g/PROVENANCE.md"
reason = "cites files of the upstream Sionna repository"

[[exception]]
path = [
  ".agents/skills/jit-execution-lead/references/architect-agent-prompt.md",
  ".agents/skills/jit-execution-lead/references/explorer-agent-prompt.md",
  ".agents/skills/jit-manage/SKILL.md",
  ".agents/skills/jit-migrate/SKILL.md",
  ".agents/skills/jit-parallel/SKILL.md",
  ".agents/skills/jit-parallel/references/worktree-mode.md",
  ".agents/skills/jit-planning-lead/references/researcher-prompt.md",
