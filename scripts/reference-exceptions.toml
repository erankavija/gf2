[[exception]]
path = "scripts/tracked-budget.toml"
reason = "names the locations it forbids"

[[exception]]
path = "dev/tools/tuning-campaign-support/tests/protocol_contracts.rs"
reason = "creates the named path in a temporary repository"

[[exception]]
path = "proofs/lake-manifest.json"
reason = "Lake writes it; `subDir` names a directory inside the upstream repository at `url`"

[[exception]]
path = "dev/tools/tuning-campaign-support/config/a83583e0/producing-build-inputs.json"
reason = "input list of finished campaign a83583e0; the campaign validator reads it under the digest the run recorded, so it keeps the files the run built from"

[[exception]]
path = "dev/tools/tuning-campaign-support/config/dbd8787d/producing-build-inputs.json"
reason = "input list of finished campaign dbd8787d; the campaign validator reads it under the digest the run recorded, so it keeps the files the run built from"

