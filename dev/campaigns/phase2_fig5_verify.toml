# Phase 2 Figure 5 paper-alignment verify sweep.
# (4096, 3249) eBCH(64,57)^2 product code vs 5G NR LDPC under AWGN.
# Uses paper-aligned 1-line ORBGRAND + list-BLER stopping. Reduced
# statistics (min_errors=15, max_frames=800) to fit into the epic
# closure window — the n=64 component is intrinsically expensive.

[campaign]
name = "phase2_fig5_verify"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig5_verify_ebch_product"
type = "product"
component = "ebch_64_57"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, list_bler_threshold = 1e-4 }
snr = { start = 2.0, stop = 3.75, step = 0.25 }
min_errors = 15
max_frames = 800

[[curve]]
name = "fig5_verify_ldpc_nms"
type = "ldpc"
base_graph = 1
n = 4096
k = 3249
algorithm = "nms"
scale = 0.75
snr = { start = 2.0, stop = 3.75, step = 0.25 }
min_errors = 15
max_frames = 800

[[curve]]
name = "fig5_verify_ldpc_sp"
type = "ldpc"
base_graph = 1
n = 4096
k = 3249
algorithm = "sum_product"
snr = { start = 2.0, stop = 3.75, step = 0.25 }
min_errors = 15
max_frames = 800
