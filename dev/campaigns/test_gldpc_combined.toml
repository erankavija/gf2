# Combined GLDPC test: damping, a larger list, and more queries at 2.0 dB
# Compare the combined configuration with the paper's reported result.

[campaign]
name = "test_gldpc_combined"
output_dir = "target/simulation_results/align"

[[curve]]
name = "fig7_gldpc_combined"
type = "gldpc"
variant = "lentmaier_1024"
sogrand = { list_size = 32, max_queries = 1000000, even_code = true, alpha = 0.7, llr_saturation = 25.0 }
snr = { start = 2.0, stop = 2.5, step = 0.5 }
min_errors = 30
max_frames = 200
