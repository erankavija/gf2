# dRM(32,21) product code waterfall characterization with GPU BCJR
# Goal: find where product code crosses LDPC baseline

[campaign]
name = "drm_waterfall_bcjr"
output_dir = "dev/simulation_results/drm_waterfall"

[[curve]]
name = "drm_gpu_bcjr"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true }
snr = { start = 1.0, stop = 3.0, step = 0.25 }
min_errors = 50
max_frames = 2000
