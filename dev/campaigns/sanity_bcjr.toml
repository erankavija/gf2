# Sanity check BCJR at key SNR points with better statistics
# Also test alpha=0.7 (less damping may help BCJR convergence)

[campaign]
name = "sanity_bcjr"
output_dir = "dev/simulation_results/align"

# BCJR with default alpha=0.5
[[curve]]
name = "bcjr_a05"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true }
snr = { start = 0.5, stop = 1.0, step = 0.5 }
min_errors = 50
max_frames = 500

# BCJR with alpha=0.7
[[curve]]
name = "bcjr_a07"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.7, list_size = 4, max_queries = 50000, use_bcjr = true }
snr = { start = 0.5, stop = 1.0, step = 0.5 }
min_errors = 50
max_frames = 500
