# Phase 1, Figure 1: (1024, 441) dRM product code vs 5G NR LDPC
#
# Reproduces the BLER curves from Figure 1 of the GRAND paper.
# Three curves: turbo-SOGRAND product code, LDPC NMS, LDPC sum-product.

[campaign]
name = "phase1_fig1"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig1_drm_product"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true }
snr = { start = 0.5, stop = 2.5, step = 0.25 }
min_errors = 100
max_frames = 5000

[[curve]]
name = "fig1_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 1024
k = 441
algorithm = "nms"
scale = 0.75
snr = { start = 0.0, stop = 2.5, step = 0.5 }
min_errors = 100
max_frames = 100000

[[curve]]
name = "fig1_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 1024
k = 441
algorithm = "sum_product"
snr = { start = 0.0, stop = 2.5, step = 0.5 }
min_errors = 100
max_frames = 100000
