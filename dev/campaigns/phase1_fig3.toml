# Phase 1, Figure 3: (256, 121) eBCH product code vs 5G NR LDPC
#
# Reproduces the BLER curves from Figure 3 of the GRAND paper.
# Three curves: turbo-SOGRAND product code, LDPC NMS, LDPC sum-product.

[campaign]
name = "phase1_fig3"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig3_ebch_product"
type = "product"
component = "ebch_16_11"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 1000000 }
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 100
max_frames = 500000

[[curve]]
name = "fig3_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 256
k = 121
algorithm = "nms"
scale = 0.75
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 100
max_frames = 500000

[[curve]]
name = "fig3_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 256
k = 121
algorithm = "sum_product"
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 100
max_frames = 500000
