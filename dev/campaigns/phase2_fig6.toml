# Canonical Phase 2 Figure 6 campaign.
# (256, 49) eBCH(16,7)^2 product code vs 5G NR LDPC under AWGN.

[campaign]
name = "phase2_fig6"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig6_ebch_16_7_product"
type = "product"
component = "ebch_16_7"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 100000, list_bler_threshold = 1e-4 }
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 100
max_frames = 200000

[[curve]]
name = "fig6_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 256
k = 49
algorithm = "nms"
scale = 0.75
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 100
max_frames = 200000

[[curve]]
name = "fig6_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 256
k = 49
algorithm = "sum_product"
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 100
max_frames = 200000
