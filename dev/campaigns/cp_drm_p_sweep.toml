# Chase-Pyndiah for dRM(32,21) with different p values
[campaign]
name = "cp_drm_p_sweep"
output_dir = "dev/simulation_results/chase_pyndiah"

[[curve]]
name = "cp_drm_p5"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 8, alpha = 0.5, list_size = 4, max_queries = 50000, chase_pyndiah = { p = 5 } }
snr = { start = 2.0, stop = 2.0, step = 0.5 }
min_errors = 10
max_frames = 20

[[curve]]
name = "cp_drm_p6"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 8, alpha = 0.5, list_size = 4, max_queries = 50000, chase_pyndiah = { p = 6 } }
snr = { start = 2.0, stop = 2.0, step = 0.5 }
min_errors = 10
max_frames = 20
