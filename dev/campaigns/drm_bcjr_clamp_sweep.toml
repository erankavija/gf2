# dRM(32,21) with GPU BCJR + extrinsic clamping sweep
# Test if bounded extrinsic improves turbo convergence

[campaign]
name = "drm_bcjr_clamp"
output_dir = "dev/simulation_results/drm_waterfall"

[[curve]]
name = "bcjr_clamp2"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true, extrinsic_clamp = 2.0 }
snr = { start = 1.0, stop = 2.5, step = 0.5 }
min_errors = 30
max_frames = 500

[[curve]]
name = "bcjr_clamp5"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true, extrinsic_clamp = 5.0 }
snr = { start = 1.0, stop = 2.5, step = 0.5 }
min_errors = 30
max_frames = 500

