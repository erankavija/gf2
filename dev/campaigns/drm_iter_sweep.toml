# Test dRM with different iteration counts
[campaign]
name = "drm_iter_sweep"
output_dir = "dev/simulation_results/drm_waterfall"

[[curve]]
name = "bcjr_iter5"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 5, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true, no_early_termination = true }
snr = { start = 1.0, stop = 1.0, step = 0.5 }
min_errors = 30
max_frames = 100

