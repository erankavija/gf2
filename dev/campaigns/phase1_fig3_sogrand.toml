# Fig 3: eBCH(16,11) product code with SOGRAND — overnight run (~10h)
#
# SOGRAND provides the queries/bit metric required by the paper.
# BCJR is faster but reports queries/bit=0.
#
# ETA breakdown (estimated ~9 fps based on observed throughput):
#   0.5 dB: ~15s (BLER≈0.67, ~150 frames for 100 errors)
#   1.0 dB: ~30s (BLER≈0.40, ~250 frames)
#   1.5 dB: ~2 min (BLER≈0.10, ~1000 frames)
#   2.0 dB: ~6 min (BLER≈0.03, ~3300 frames)
#   2.5 dB: ~1h (BLER≈0.003, ~33K frames)
#   3.0 dB: ~5h (BLER≈0.0006, ~167K frames, capped at 200K)
#   3.5 dB: ~3h (BLER≈0.00005, capped at 100K frames, ~5 errors expected)

[campaign]
name = "phase1_fig3_sogrand"
output_dir = "dev/simulation_results/phase1_final"

[[curve]]
name = "fig3_ebch_sogrand"
type = "product"
component = "ebch_16_11"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 100000 }
snr = { start = 0.5, stop = 3.5, step = 0.5 }
min_errors = 100
max_frames = 200000
