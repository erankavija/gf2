# Test GLDPC with damping (alpha=0.7) and LLR saturation at 2.0 dB
# Previous result without damping: BLER=0.938 at 2.0 dB (paper: 0.130)

[campaign]
name = "test_gldpc_damping"
output_dir = "dev/simulation_results/align"

[[curve]]
name = "fig7_gldpc_damped"
type = "gldpc"
variant = "lentmaier_1024"
sogrand = { list_size = 4, max_queries = 100000, even_code = true, alpha = 0.7, llr_saturation = 25.0 }
snr = { start = 2.0, stop = 2.0, step = 0.5 }
min_errors = 30
max_frames = 200
