# Chase-Pyndiah sanity check with eBCH(16,11)
# If this works, the Chase-Pyndiah framework is correct and the dRM issue is code-specific.

[campaign]
name = "cp_ebch_sanity"
output_dir = "dev/simulation_results/chase_pyndiah"

[[curve]]
name = "cp_ebch_16_11"
type = "product"
component = "ebch_16_11"
turbo = { max_iterations = 8, alpha = 0.5, list_size = 4, max_queries = 50000, chase_pyndiah = { p = 4 } }
snr = { start = 1.0, stop = 3.0, step = 0.5 }
min_errors = 30
max_frames = 500
