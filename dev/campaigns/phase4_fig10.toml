# Phase 4, Figure 10: eBCH(64,57)^2 product code vs 5G NR LDPC, Rician fading
#
# Paper-aligned turbo-SOGRAND with 1-line ORBGRAND + list-BLER stopping.
# Channel: QPSK + Rician K=6, N_c=256, t=8, frame=4096 bits. The (4096,
# 3249) code is large; we keep min_errors=15 + max_frames=800 for a
# sanity run that captures the main waterfall without paying the
# paper's 3e-3 floor budget.

[campaign]
name = "phase4_fig10"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig10_ebch_product"
type = "product"
component = "ebch_64_57"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, list_bler_threshold = 1e-4 }
channel = { kind = "rician", preset = "fig10" }
snr = { start = 0.0, stop = 8.0, step = 2.0 }
min_errors = 15
max_frames = 800

[[curve]]
name = "fig10_ldpc_nms"
type = "ldpc"
base_graph = 1
n = 4096
k = 3249
algorithm = "nms"
scale = 0.75
channel = { kind = "rician", preset = "fig10" }
snr = { start = 0.0, stop = 8.0, step = 2.0 }
min_errors = 15
max_frames = 800

[[curve]]
name = "fig10_ldpc_sp"
type = "ldpc"
base_graph = 1
n = 4096
k = 3249
algorithm = "sum_product"
channel = { kind = "rician", preset = "fig10" }
snr = { start = 0.0, stop = 8.0, step = 2.0 }
min_errors = 15
max_frames = 800
