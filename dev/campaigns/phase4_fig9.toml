# Phase 4, Figure 9: eBCH(32,26)² product code vs 5G NR LDPC over Rician fading
#
# Reproduces the BLER curves from Figure 9 of the SO-GRAND paper.
# Channel: QPSK + Rician fading, K=8, N_c=256, t=2, frame_bits=1024.
# Three curves: eBCH(32,26)² product code (BCJR turbo), 5G NR LDPC BG2
# (1024, 676) with NMS and sum-product decoders.
#
# Code parameters:
#   eBCH(32,26)^2 -> n=1024, k=676, rate≈0.66
#   LDPC BG2      -> n=1024, k=676, rate≈0.66
#
# Note: eBCH(32,26) uses BCJR SISO decoder (not SOGRAND) because SOGRAND
# is impractical at n=32 (>20s/frame). BCJR provides exact APP LLRs and
# is the standard SISO algorithm for codes with small trellis.

[campaign]
name = "phase4_fig9"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig9_ebch_product"
type = "product"
component = "ebch_32_26"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 2, max_queries = 50000, use_bcjr = true }
channel = { kind = "rician", preset = "fig9" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000

[[curve]]
name = "fig9_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 1024
k = 676
algorithm = "nms"
scale = 0.75
channel = { kind = "rician", preset = "fig9" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000

[[curve]]
name = "fig9_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 1024
k = 676
algorithm = "sum_product"
channel = { kind = "rician", preset = "fig9" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000
