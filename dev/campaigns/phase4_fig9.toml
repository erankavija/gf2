# Phase 4, Figure 9: eBCH(32,26)^2 product code vs 5G NR LDPC, Rician fading
#
# Paper-aligned turbo-SOGRAND: 1-line ORBGRAND auto-IC + list-BLER
# stopping (P(C \ L) < 1e-4 or L=4). Channel: QPSK + Rician K=8,
# N_c=256, t=2, frame=1024 bits. Code (1024, 676), rate ≈ 0.66.

[campaign]
name = "phase4_fig9"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig9_ebch_product"
type = "product"
component = "ebch_32_26"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 100000, list_bler_threshold = 1e-4 }
channel = { kind = "rician", preset = "fig9" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000

[[curve]]
name = "fig9_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 1024
k = 676
algorithm = "nms"
scale = 0.75
channel = { kind = "rician", preset = "fig9" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000

[[curve]]
name = "fig9_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 1024
k = 676
algorithm = "sum_product"
channel = { kind = "rician", preset = "fig9" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000
