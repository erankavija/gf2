# Hypothesis test: does list_size=64 fix the dRM alignment gap at 1.0 dB?
# Paper SOGRAND at 1.0 dB: BLER=0.072. Ours with list_size=4: BLER=0.667.

[campaign]
name = "test_listsize"
output_dir = "dev/simulation_results/align"

[[curve]]
name = "fig1_drm_ls64"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 64, max_queries = 1000000 }
snr = { start = 1.0, stop = 1.0, step = 0.5 }
min_errors = 30
max_frames = 200
