# Fig 1 dRM product code — high-statistics run for 1.5-1.75 dB
# Increases max_frames to collect ≥100 errors at these SNR points

[campaign]
name = "phase1_fig1_highstat"
output_dir = "dev/simulation_results/phase1_final"

[[curve]]
name = "fig1_drm_product"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true }
snr = { start = 0.5, stop = 2.0, step = 0.25 }
min_errors = 100
max_frames = 200000
