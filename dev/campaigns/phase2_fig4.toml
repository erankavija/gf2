# Canonical Phase 2 Figure 4 campaign.
# (625, 225) CRC(25,15)^2 product code vs 5G NR LDPC under AWGN.

[campaign]
name = "phase2_fig4"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig4_crc_product"
type = "product"
component = "crc_25_15"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 100000 }
snr = { start = 0.0, stop = 3.0, step = 0.5 }
min_errors = 100
max_frames = 200000

[[curve]]
name = "fig4_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 625
k = 225
algorithm = "nms"
scale = 0.75
snr = { start = 0.0, stop = 3.0, step = 0.5 }
min_errors = 100
max_frames = 200000

[[curve]]
name = "fig4_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 625
k = 225
algorithm = "sum_product"
snr = { start = 0.0, stop = 3.0, step = 0.5 }
min_errors = 100
max_frames = 200000
