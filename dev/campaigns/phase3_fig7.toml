# Phase 3, Figure 7: (1024, 646) GLDPC vs 5G NR LDPC
#
# Reproduces the BLER curves from Figure 7 of the GLDPC-SOGRAND paper.
# Two curves: QC-GLDPC with eBCH(32,26) component, 5G NR LDPC (BG1).

[campaign]
name = "phase3_fig7"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig7_gldpc"
type = "gldpc"
variant = "lentmaier_1024"
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 100
max_frames = 500000

[[curve]]
name = "fig7_ldpc_nms"
type = "ldpc"
base_graph = 1
n = 1024
k = 646
algorithm = "nms"
scale = 0.75
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 100
max_frames = 500000
