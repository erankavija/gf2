# Phase 1 Fig 3 smoke to check for regressions after 1-line ORBGRAND landing.
# Run only the product curve at a few SNR points with reduced statistics.

[campaign]
name = "phase1_fig3_smoke"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig3_smoke_ebch_product"
type = "product"
component = "ebch_16_11"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 100000, list_bler_threshold = 1e-4 }
snr = { start = 1.0, stop = 3.0, step = 0.5 }
min_errors = 30
max_frames = 5000
