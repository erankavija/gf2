# Direct SOGRAND vs BCJR comparison for dRM at key SNR points
[campaign]
name = "drm_sogrand_vs_bcjr"
output_dir = "dev/simulation_results/drm_waterfall"

# SOGRAND turbo — reduced queries for speed
[[curve]]
name = "sogrand_50k"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000 }
snr = { start = 1.0, stop = 2.0, step = 0.5 }
min_errors = 20
max_frames = 50
