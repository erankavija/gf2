# Compare eBCH BCJR turbo vs paper to check if turbo framework is correct
[campaign]
name = "ebch_bcjr_compare"
output_dir = "dev/simulation_results/drm_waterfall"

[[curve]]
name = "ebch_bcjr"
type = "product"
component = "ebch_16_11"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true }
snr = { start = 1.0, stop = 3.5, step = 0.5 }
min_errors = 30
max_frames = 500
