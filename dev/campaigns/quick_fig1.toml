# Quick sanity check for Fig 1: (1024, 441) — verify waterfall shape
# Reduced statistics: min_errors=10, max_frames=1000

[campaign]
name = "quick_fig1"
output_dir = "dev/simulation_results/quick"

[[curve]]
name = "fig1_drm_product"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 100000 }
snr = { start = 0.0, stop = 2.5, step = 0.5 }
min_errors = 10
max_frames = 1000

[[curve]]
name = "fig1_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 1024
k = 441
algorithm = "nms"
scale = 0.75
snr = { start = 0.0, stop = 2.5, step = 0.5 }
min_errors = 10
max_frames = 1000

[[curve]]
name = "fig1_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 1024
k = 441
algorithm = "sum_product"
snr = { start = 0.0, stop = 2.5, step = 0.5 }
min_errors = 10
max_frames = 1000
