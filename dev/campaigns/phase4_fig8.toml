# Phase 4, Figure 8: dRM(32,21)^2 product code vs 5G NR LDPC, Rician fading
#
# Paper-aligned turbo-SOGRAND with 1-line ORBGRAND auto-IC and list-BLER
# stopping (OrbGrandConfig::list_bler_stop_threshold, plumbed via the
# turbo-level list_bler_threshold) so each component decode exits once
# P(C \ L) drops below the threshold — matching the SO-GRAND Fig 8
# caption "lists are added to until L=4 OR predicted list-BLER < 1e-4".
#
# Channel: QPSK + Rician K=5, N_c=128, t=4, frame=1024 bits.
# Code parameters:
#   dRM(32,21)^2  -> n=1024, k=441, rate≈0.43
#   LDPC BG2      -> n=1024, k=441, rate≈0.43

[campaign]
name = "phase4_fig8"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig8_drm_product"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 100000, list_bler_threshold = 1e-4 }
channel = { kind = "rician", preset = "fig8" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000

[[curve]]
name = "fig8_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 1024
k = 441
algorithm = "nms"
scale = 0.75
channel = { kind = "rician", preset = "fig8" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000

[[curve]]
name = "fig8_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 1024
k = 441
algorithm = "sum_product"
channel = { kind = "rician", preset = "fig8" }
snr = { start = 0.0, stop = 8.0, step = 1.0 }
min_errors = 30
max_frames = 5000
