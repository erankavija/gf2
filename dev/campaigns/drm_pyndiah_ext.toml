# Test Pyndiah-style extrinsic: L_E = L_APP - L_Ch (not subtracting L_A)
# This provides "momentum" through accumulated a-priori information
[campaign]
name = "drm_pyndiah_ext"
output_dir = "dev/simulation_results/drm_waterfall"

[[curve]]
name = "bcjr_pyndiah_ext"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true, pyndiah_extrinsic = true }
snr = { start = 0.5, stop = 2.0, step = 0.25 }
min_errors = 50
max_frames = 500
