# Phase 2 Figure 6 paper-alignment verify sweep.
# (256, 49) eBCH(16,7)^2 product code vs 5G NR LDPC under AWGN.
# Reduced statistics to confirm curve shape after 1-line ORBGRAND fix.

[campaign]
name = "phase2_fig6_verify"
output_dir = "dev/simulation_results"

[[curve]]
name = "fig6_verify_ebch_product"
type = "product"
component = "ebch_16_7"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 100000, list_bler_threshold = 1e-4 }
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 30
max_frames = 5000

[[curve]]
name = "fig6_verify_ldpc_nms"
type = "ldpc"
base_graph = 2
n = 256
k = 49
algorithm = "nms"
scale = 0.75
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 30
max_frames = 5000

[[curve]]
name = "fig6_verify_ldpc_sp"
type = "ldpc"
base_graph = 2
n = 256
k = 49
algorithm = "sum_product"
snr = { start = 0.0, stop = 4.0, step = 0.5 }
min_errors = 30
max_frames = 5000
