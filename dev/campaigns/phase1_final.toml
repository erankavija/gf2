# Phase 1 final simulations with corrected dRM(32,21) code
# Fig 1: dRM product code vs LDPC
# Fig 3: eBCH product code vs LDPC (already done, verify no regression)

[campaign]
name = "phase1_final"
output_dir = "dev/simulation_results/phase1_final"

# Fig 1: dRM(32,21) product code with GPU BCJR
[[curve]]
name = "fig1_drm_product"
type = "product"
component = "drm_32_21"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true }
snr = { start = 0.5, stop = 2.5, step = 0.25 }
min_errors = 100
max_frames = 5000

# Fig 3: eBCH(16,11) product code with GPU BCJR
[[curve]]
name = "fig3_ebch_product"
type = "product"
component = "ebch_16_11"
turbo = { max_iterations = 20, alpha = 0.5, list_size = 4, max_queries = 50000, use_bcjr = true, use_gpu_bcjr = true }
snr = { start = 0.5, stop = 3.5, step = 0.5 }
min_errors = 100
max_frames = 5000
