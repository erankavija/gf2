[package]
name = "f7-packing-prototype"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone F_7 packed-encoding prototype for JIT issue f10152f6 (R2) — not part of the gf2 workspace"
rust-version = "1.95"

[[bin]]
name = "f7-packing-prototype"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# This standalone research prototype is intentionally not a workspace member.
[workspace]
