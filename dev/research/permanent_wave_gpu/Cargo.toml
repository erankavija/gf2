[package]
name = "permanent-wave-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Standalone wave-parallel permanent HIP research prototype"

[lib]
name = "permanent_wave_gpu"
path = "src/lib.rs"

[[bin]]
name = "wave-gf3-device-evidence"
path = "src/bin/wave_gf3_device_evidence.rs"
required-features = ["hip", "fixture-oracle"]

[[bin]]
name = "f5-wave-device-evidence"
path = "src/bin/f5_wave_device_evidence.rs"
required-features = ["hip", "fixture-oracle"]

[[bin]]
name = "wave-gf7-device-evidence"
path = "src/bin/wave_gf7_device_evidence.rs"
required-features = ["hip", "fixture-oracle"]

[features]
default = ["fixture-oracle"]
# The deterministic fixture corpus reuses the campaign's sampler. Keep that
# higher-level dependency off when this crate is consumed only for its
# candidate registry.
fixture-oracle = ["dep:permanent-statistics"]
# Enables HIP source compilation. This is deliberately opt-in so registry tests
# remain runnable on hosts without a ROCm toolchain or device.
hip = []

[dependencies]
gf2-algebra = { path = "../../../crates/gf2-algebra", features = ["f5", "f7"] }
gf2-core = { path = "../../../crates/gf2-core" }
# The campaign crate owns the canonical domain-separated sampler. Fixtures use
# its Validation stream rather than assigning another tag in this prototype.
permanent-statistics = { path = "../../../experiments/permanent-statistics", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# This standalone research prototype is intentionally not a workspace member.
[workspace]
