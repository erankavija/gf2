[package]
name = "permanent-wave-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Standalone wave-parallel permanent HIP research prototype"

[lib]
name = "permanent_wave_gpu"
path = "src/lib.rs"

[features]
default = []
# Enables HIP source compilation. This is deliberately opt-in so registry tests
# remain runnable on hosts without a ROCm toolchain or device.
hip = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# This standalone research prototype is intentionally not a workspace member.
[workspace]
