[package]
name = "permanent-wave-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Standalone wave-parallel permanent HIP research prototype"

[lib]
name = "permanent_wave_gpu"
path = "src/lib.rs"

[features]
default = []
# Enables HIP source compilation. This is deliberately opt-in so registry tests
# remain runnable on hosts without a ROCm toolchain or device.
hip = []

[dependencies]
gf2-algebra = { path = "../../../crates/gf2-algebra", features = ["f5", "f7"] }
gf2-core = { path = "../../../crates/gf2-core" }
# The feasibility harness owns the campaign's canonical domain-separated
# sampler and MeasurementPurpose vocabulary.  Fixtures use its Equivalence
# domain rather than assigning another random stream tag in this prototype.
permanent-sampling-feas = { path = "../permanent-sampling-feas" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# This standalone research prototype is intentionally not a workspace member.
[workspace]
