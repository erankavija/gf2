[package]
name = "simd_batching_bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone SIMD-batching microbench for JIT issue c7542983 (R4) — not part of the gf2 workspace"
rust-version = "1.95"

[lib]
name = "simd_batching_bench"
path = "src/lib.rs"

[[bin]]
name = "simd_batching_bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Standalone research microbench: deliberately not a workspace member.
[workspace]
