[package]
name = "f3-bipedal-prototype"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone F_3 bipedal-vs-naive prototype — reproduces the per-element cost of the Scheinerman bipedal F_3 encoding (arxiv 2407.20205v2) for comparison against the F_5/F_7 R-decision prototypes. Not part of the gf2 workspace."
rust-version = "1.95"

[[bin]]
name = "f3-bipedal-prototype"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# This standalone research prototype is intentionally not a workspace member.
[workspace]
