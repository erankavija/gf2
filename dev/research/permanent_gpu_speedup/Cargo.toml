[package]
name = "permanent-gpu-speedup"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Vesa Kaskivuo <vesa.kaskivuo@iki.fi>"]
publish = false
description = "S1g GPU 50x speedup measurement for permanent_bipedal3 (F_3) at n=36 — JIT issue 9480f8a6. Standalone non-workspace prototype."

[[bin]]
name = "permanent_gpu_speedup"
path = "src/main.rs"

[[bin]]
name = "det_check"
path = "src/det_check.rs"

[[bin]]
name = "simd_check"
path = "src/simd_check.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[features]
default = []
hip = ["gf2-algebra/hip"]

[dependencies]
gf2-algebra = { path = "../../../crates/gf2-algebra", features = ["simd", "parallel", "f5", "f7", "test-support"] }
gf2-core = { path = "../../../crates/gf2-core" }
permanent-gpu-common = { path = "../permanent_gpu_common" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# This standalone research prototype is intentionally not a workspace member.
[workspace]
