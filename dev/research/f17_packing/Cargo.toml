[package]
name = "f17-packing-prototype"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone F_17 packed-encoding prototype — tests the Fermat-like (p−1 = 2^4) prediction from the cross-prime generalization analysis. Not part of the gf2 workspace."
rust-version = "1.95"

[[bin]]
name = "f17-packing-prototype"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# This standalone research prototype is intentionally not a workspace member.
[workspace]
