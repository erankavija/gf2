[package]
name = "rns_prototype"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone RNS prototype for JIT issue 0a7e2555 — not part of the gf2 workspace"
rust-version = "1.80"

[[bin]]
name = "rns_prototype"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# This standalone research prototype is intentionally not a workspace member.
[workspace]

