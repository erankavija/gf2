# Profile driver of the LDPC batch decoder for the `3be770d5` session script
# (jit:ed3d490e).
#
# A member of the arms workspace with a package of its own: a dependency added
# to the arms' package moves the digests of their executables.

# The path dependencies below count directory levels to the harness crates:
# the named exception `harness-path-dependencies` to
# `@/inv/no-dev-path-coupling`, which ends under `@/issue/58a4bb51`.

[package]
name = "ldpc-batch-profile"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
ldpc-batch-arms = { path = ".." }
ldpc-survey-harness = { path = "../../../../1a379447-zen3-cpu-performance/c077a88b/survey/harness" }
ldpc-throughput-harness = { path = "../../../../1a379447-zen3-cpu-performance/3be770d5/survey/harness" }
tuning-campaign-support = { path = "../../../../../tools/tuning-campaign-support" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "ldpc-batch-profile"
path = "src/main.rs"
