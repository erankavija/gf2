# Steady-state arms of the LDPC batch decoder comparison (jit:ed3d490e): the
# gf2 arms and the AFF3CT [Cassagne2019] sum-product INTRA arm.
#
# A standalone workspace with its own target directory: it adds no target,
# feature or dependency to the production workspace and rebuilds no harness of
# the LDPC campaigns it follows, whose executables are pinned by digest.
#
# The pinned worker pool, recorded-bundle loader, steady-state driver and
# placement and quality checks are those of the `3be770d5` harness, and the
# child framing, timing windows and prepared quality those of `c077a88b`, by
# path. The gf2 arms differ from the `3be770d5` gf2 arm in the decoder call
# alone. The INTRA arm compiles one C++ translation unit that includes the
# `3be770d5` unit unchanged and adds the decoder `a3_new` does not build.

# The path dependencies below count directory levels to the harness crates and
# the workspace crates: the named exception `harness-path-dependencies` to
# `@/inv/no-dev-path-coupling`, which ends under `@/issue/58a4bb51`.

[workspace]

[package]
name = "ldpc-batch-arms"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
# Links the pinned AFF3CT static library; needs GF2_AFF3CT_ROOT.
aff3ct = []

[dependencies]
ldpc-survey-harness = { path = "../../../1a379447-zen3-cpu-performance/c077a88b/survey/harness" }
ldpc-throughput-harness = { path = "../../../1a379447-zen3-cpu-performance/3be770d5/survey/harness" }
gf2-coding = { path = "../../../../../crates/gf2-coding" }
gf2-core = { path = "../../../../../crates/gf2-core" }
gf2-kernels-simd = { path = "../../../../../crates/gf2-kernels-simd" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
cc = "1"
sha2 = "0.10"

[lib]
name = "ldpc_batch_arms"
path = "src/lib.rs"

[[bin]]
name = "gf2-batch-single-frame-arm"
path = "src/bin/gf2-batch-single-frame-arm.rs"

[[bin]]
name = "gf2-batch-lane-arm"
path = "src/bin/gf2-batch-lane-arm.rs"

[[bin]]
name = "aff3ct-intra-arm"
path = "src/bin/aff3ct-intra-arm.rs"
required-features = ["aff3ct"]

[[bin]]
name = "aff3ct-intra-quality"
path = "src/bin/aff3ct-intra-quality.rs"
required-features = ["aff3ct"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"
