# External BCH encoder arms of the integrated BCH comparison (jit:1358d6ab).
#
# A standalone workspace: AFF3CT [Cassagne2019] and bchlib [Bchlib2026], the
# external encoders of the `4e732b56` survey, behind the runner's arm contract.
# The case, its messages and gf2's reference codewords are those of the
# consumer harness the gf2 arm runs, by path. The build needs GF2_AFF3CT_ROOT,
# the staged AFF3CT tree, and GF2_BCHLIB_ROOT, the bchlib checkout.

# The path dependencies below count directory levels to the harness crates:
# the named exception `harness-path-dependencies` to
# `@/inv/no-dev-path-coupling`, which ends under `@/issue/58a4bb51`.

[workspace]

[package]
name = "bch-external-arms"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
consumer-profile-gf2-side = { path = "../../../04b85d10/survey/gf2-side" }
gf2-coding = { path = "../../../../../../crates/gf2-coding" }
gf2-core = { path = "../../../../../../crates/gf2-core" }
tuning-campaign-support = { path = "../../../../../../dev/tools/tuning-campaign-support" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
cc = "1"

[lib]
name = "bch_external_arms"
path = "src/lib.rs"

[[bin]]
name = "bch-external-arm"
path = "src/bin/bch-external-arm.rs"

[[bin]]
name = "bch-external-verify"
path = "src/bin/bch-external-verify.rs"

# The consumer harness's release profile, so both arms of a cell share it.
[profile.release]
lto = "thin"
codegen-units = 1
