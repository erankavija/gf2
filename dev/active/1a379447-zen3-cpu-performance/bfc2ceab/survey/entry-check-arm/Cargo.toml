# Arm of the entry-check cost family (jit:bfc2ceab).
#
# A standalone workspace, so the campaign adds no target, feature or
# dependency to the production workspace. Both arms of a pair are this one
# package built twice: the baseline without any flag and the candidate with
# `RUSTFLAGS="--cfg gf2_entry_checked"`, under which the kernel crate's
# detection functions publish the checked wrappers. `gf2-core/test-support`
# supplies the route witnesses the arm reports; no parallel feature is
# enabled, so every consumer runs on the calling thread.

[workspace]

[package]
name = "entry-check-arm"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gf2_entry_checked)'] }

[dependencies]
gf2-algebra = { path = "../../../../../../crates/gf2-algebra", default-features = false, features = ["simd"] }
gf2-core = { path = "../../../../../../crates/gf2-core", features = ["simd", "test-support"] }
gf2-kernels-simd = { path = "../../../../../../crates/gf2-kernels-simd" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tuning-campaign-support = { path = "../../../../../tools/tuning-campaign-support" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "entry-check-arm"
path = "src/bin/entry-check-arm.rs"

# The workspace release profile verbatim, so the measured executable is the
# build a production receipt would measure.
[profile.release]
lto = "thin"
codegen-units = 1
