# Checked-form prototypes of the caller-trusted kernel entry points
# (jit:bfc2ceab), a standalone workspace outside every production path;
# `regen-prototype-listing.py` beside this crate writes their assembly.

[workspace]

[package]
name = "caller-trusted-check-prototype"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
gf2-kernels-simd = { path = "../../../../../../crates/gf2-kernels-simd" }

[lib]
path = "src/lib.rs"

# The workspace release profile verbatim, so a listing shows the code a
# production build of the same check would hold.
[profile.release]
lto = "thin"
codegen-units = 1
