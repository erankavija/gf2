# Checked-form prototypes of the caller-trusted kernel entry points
# (jit:bfc2ceab).
#
# A standalone workspace, so the prototypes add no target, feature or
# dependency to the production workspace and stay outside every production
# path. Each interface has a `*_current` function that forwards to the
# published pointer and a `*_checked` function that runs the release-mode
# check first; `../regen-prototype-listing.sh` writes their assembly.

[workspace]

[package]
name = "caller-trusted-check-prototype"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
gf2-kernels-simd = { path = "../../../../../../crates/gf2-kernels-simd" }

[lib]
path = "src/lib.rs"

# The workspace release profile verbatim, so a listing shows the code a
# production build of the same check would hold.
[profile.release]
lto = "thin"
codegen-units = 1
