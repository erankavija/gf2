# Arm of the sparse product check-cost family (jit:bfc2ceab).
#
# A standalone workspace, so the campaign adds no target, feature or
# dependency to the production workspace. Both arms of a pair are this one
# executable; the environment selects the form. No parallel feature is
# enabled, so both forms run on the calling thread.

[workspace]

[package]
name = "spmm-check-arm"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
gf2-core = { path = "../../../../../../crates/gf2-core", features = ["simd"] }
gf2-kernels-simd = { path = "../../../../../../crates/gf2-kernels-simd" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tuning-campaign-support = { path = "../../../../../tools/tuning-campaign-support" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "spmm-check-arm"
path = "src/bin/spmm-check-arm.rs"

# The workspace release profile verbatim, so the measured executable is the
# build a production receipt would measure.
[profile.release]
lto = "thin"
codegen-units = 1
