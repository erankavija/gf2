# gf2 baseline arm for the byte-field survey (jit:6c6b09b1).
#
# Standalone workspace so the survey adds no target, feature, or dependency
# to the production workspace; it consumes `gf2-core` by path exactly as an
# external user would, with the `simd` feature that gates runtime kernel
# dispatch. It links no external library, so its executable identity is the
# gf2 side alone.

[workspace]

[package]
name = "byte-field-gf2-side"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
byte-field-arm-common = { path = "../arm-common" }
gf2-core = { path = "../../../../../crates/gf2-core", features = ["simd"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "gf2-arm"
path = "src/gf2_arm.rs"

[[bin]]
name = "gf2-conformance"
path = "src/gf2_conformance.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
