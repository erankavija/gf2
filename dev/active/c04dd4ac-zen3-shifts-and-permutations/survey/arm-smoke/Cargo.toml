# Non-timed arm smoke for story c04dd4ac's protocol-v4 plans (jit:9fb40c83,
# jit:85fc5ff4).
#
# A standalone workspace, like the `f63a2464` and `bb769456` survey crates: it
# adds no target, feature or dependency to the production workspace and keeps
# its own target directory, so the arm executables it launches stay
# byte-identical to the ones a campaign launches. It links
# `tuning-campaign-support` for the runner's own plan decoder, request framing
# and result parser, and links no arm: an arm is an executable it launches.

[workspace]

[package]
name = "c04dd4ac-arm-smoke"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[[bin]]
name = "arm-smoke"
path = "src/main.rs"

[dependencies]
tuning-campaign-support = { path = "../../../../tools/tuning-campaign-support" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
