# Population-count survey harness (jit:26465e6c).
#
# One arm binary serves every arm of both families: gf2's production
# dispatcher and internal controls, and the vendored libpopcnt and Mula
# kernels, which `build.rs` compiles with their upstream-recommended flags and
# links in. Every arm therefore runs under the same fixture, timing loop and
# per-call structure. The crate is its own workspace so its build graph stays
# separate from the production workspace while consuming gf2 by path.

[workspace]

[package]
name = "popcount-survey"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "popcount-arm"
path = "src/bin/popcount-arm.rs"

[[bin]]
name = "popcount-verify"
path = "src/bin/popcount-verify.rs"

[[bin]]
name = "check-plan"
path = "src/bin/check-plan.rs"

[[bin]]
name = "import-v1-ledger"
path = "src/bin/import-v1-ledger.rs"

[dependencies]
gf2-core = { path = "../../../../../crates/gf2-core", features = ["simd"] }
gf2-kernels-simd = { path = "../../../../../crates/gf2-kernels-simd" }
tuning-campaign-support = { path = "../../../../tools/tuning-campaign-support" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

# The repository's release profile: thin LTO and one codegen unit, no ISA
# flags, so gf2 reaches AVX2 only through its runtime detection.
[profile.release]
lto = "thin"
codegen-units = 1
