[package]
name = "tuning-campaign-support"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
serde = { workspace = true }
# `float_roundtrip`: journal records, checkpoint units and receipts are
# re-encoded and compared byte for byte, so every f64 must parse back to the
# value that printed it.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
rustix = { version = "1.1", features = ["process", "thread"] }
