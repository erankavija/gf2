# Arm executable for the transpose-lane receipts (jit:1d4fd63d).
#
# A standalone workspace, so the receipt adds no target, feature or dependency
# to the production workspace and consumes the production crates exactly as an
# external user would. It enables `simd` on gf2-core, which is the feature that
# makes `BitMatrix::transpose` reach the dispatched block kernel at all, and
# nothing else: `test-support` would compile this repository's conformance
# recorders and forcing switches into the measured code, which production never
# carries. Pinning a lane needs none of them — the arm names one through the
# public `gf2_kernels_simd::transpose::lane` and hands it to
# `BitMatrix::transpose_with_block_kernel` or to a `BchEncodeFns` field.
#
# Child-v2 framing and window timing come from `tuning-campaign-support`; this
# crate restates neither.

[workspace]

[package]
name = "transpose-lane-arms"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[[bin]]
name = "transpose-lane-arm"
path = "src/main.rs"

[dependencies]
gf2-core = { path = "../../../../crates/gf2-core", features = ["simd"] }
gf2-coding = { path = "../../../../crates/gf2-coding" }
gf2-kernels-simd = { path = "../../../../crates/gf2-kernels-simd" }
tuning-campaign-support = { path = "../../../../dev/tools/tuning-campaign-support" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# The workspace release profile verbatim, so the arm build is the one a
# production receipt measures rather than a differently optimized build.
[profile.release]
lto = "thin"
codegen-units = 1
