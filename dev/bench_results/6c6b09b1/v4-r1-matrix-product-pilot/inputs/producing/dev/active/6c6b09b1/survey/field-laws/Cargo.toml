# Shared field-law suite over the survey's GF(2^8) element types
# (jit:6c6b09b1).
#
# A separate standalone workspace because the suite needs gf2-core's
# `test-support` feature, which the measured arm must not enable: this
# crate's feature unification never reaches the gf2 arm's build.

[workspace]

[package]
name = "byte-field-field-laws"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
byte-field-gf2-side = { path = "../gf2-side" }
gf2-core = { path = "../../../../../crates/gf2-core", features = ["simd", "test-support"] }

[[bin]]
name = "survey-field-laws"
path = "src/main.rs"

[profile.release]
opt-level = 3
