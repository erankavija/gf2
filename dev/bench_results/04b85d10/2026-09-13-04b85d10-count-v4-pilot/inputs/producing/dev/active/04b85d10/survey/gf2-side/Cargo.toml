# Consumer-profiling harness for the bit-storage profile (jit:04b85d10).
#
# A standalone workspace so the profile adds no target, feature or dependency
# to the production workspace. It consumes the production crates by path
# exactly as an external user does, and it consumes the protocol tooling for
# the canonical child-v2 transport and fixed-window timing rather than
# reimplementing either.

[workspace]

[package]
name = "consumer-profile-gf2-side"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
gf2-core = { path = "../../../../../crates/gf2-core", features = ["simd", "parallel"] }
gf2-coding = { path = "../../../../../crates/gf2-coding", features = ["parallel"] }
gf2-kernels-simd = { path = "../../../../../crates/gf2-kernels-simd" }
tuning-campaign-support = { path = "../../../../../dev/tools/tuning-campaign-support" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# The workspace release profile verbatim, so the harness build is the one a
# production receipt measures rather than a differently optimized build.
[profile.release]
lto = "thin"
codegen-units = 1
