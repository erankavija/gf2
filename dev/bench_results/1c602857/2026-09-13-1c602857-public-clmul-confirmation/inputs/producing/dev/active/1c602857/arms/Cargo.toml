# Arm executable for the public wide carry-less product before/after receipt
# (jit:1c602857).
#
# A standalone workspace, so the receipt adds no target, feature or dependency
# to the production workspace and consumes gf2-core exactly as an external user
# would. It enables `simd` and nothing else: `test-support` would compile the
# conformance suite's lane recorder and fallback switch into the measured code,
# which production never carries.
#
# Child-v2 framing and window timing come from `tuning-campaign-support`; this
# crate restates neither.

[workspace]

[package]
name = "public-clmul-arms"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[[bin]]
name = "clmul-wide-arm"
path = "src/main.rs"

[dependencies]
gf2-core = { path = "../../../../crates/gf2-core", features = ["simd"] }
gf2-kernels-simd = { path = "../../../../crates/gf2-kernels-simd" }
tuning-campaign-support = { path = "../../../../dev/tools/tuning-campaign-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
