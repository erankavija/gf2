# Repository-wide cargo configuration.
#
# This file carries only settings that must reach EVERY cargo invocation in the
# repository, whether or not it goes through `scripts/cargo-budget.sh`. Process
# concerns that depend on what else is running — job count, the exclusive test
# lock, nice levels, the sccache wrapper — live in that script instead, because
# a config file cannot observe host load and because a committed
# `rustc-wrapper` is a hard failure on a host without sccache, which the GitHub
# runners are.

[env]
# Bounds the rayon pool each test process opens. Pairs with `threads-required`
# in `.config/nextest.toml`, which reserves the matching number of nextest
# scheduler slots for the test binaries that build a pool: 4 slots x 4 threads
# = 4 CPUs per parallel test, while scalar tests keep one slot and one thread
# and still fill the machine.
#
# It lives here rather than in `.config/nextest.toml` because nextest 0.9.133
# supports no env configuration at all — `env`, `profile.<n>.env` and
# per-override `env` are each reported as an unknown configuration key — and
# because a direct `cargo nextest run` must get the same bound as a run through
# the wrapper. Without it nextest reserves four slots for a test that opens a
# 24-wide pool.
#
# Deliberately not `force`: an explicit RAYON_NUM_THREADS in the environment
# still wins, which is how `CARGO_CI_RAYON_THREADS` and the benchmark sweeps
# that vary thread counts keep working.
#
# Scope: this reaches the processes Cargo launches, test binaries under nextest
# included. A binary executed directly from `target/` inherits nothing from
# here. A preregistered runner that declares RAYON_NUM_THREADS as an
# experimental input sets it explicitly rather than depending on its launch
# path — see the host CPU budget section of AGENTS.md.
RAYON_NUM_THREADS = "4"
