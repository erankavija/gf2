# Standalone gf2-side arms for the transpose, logical-XOR, and BCH cells
# (jit:6fb89a3c).  This project is deliberately isolated from the workspace.
#
# `gf2-core/simd` is named explicitly so the runtime-dispatched logical and
# transpose routes the production consumers use (gf2-coding enables the same
# feature by default) are part of this crate's declared identity rather than
# an artifact of feature unification.

[workspace]

[package]
name = "survey-gf2-side-6fb89a3c"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gf2-core = { path = "../../../../../crates/gf2-core", features = ["simd"] }
gf2-kernels-simd = { path = "../../../../../crates/gf2-kernels-simd" }
gf2-coding = { path = "../../../../../crates/gf2-coding", features = ["test-support"] }
tuning-campaign-support = { path = "../../../../../dev/tools/tuning-campaign-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
