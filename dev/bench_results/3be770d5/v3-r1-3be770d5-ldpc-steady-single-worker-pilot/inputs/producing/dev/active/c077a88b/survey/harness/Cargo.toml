# LDPC decoder baseline survey harness (jit:c077a88b).
#
# A standalone workspace so the survey adds no target, feature, or dependency
# to the production workspace; it consumes `gf2-coding`, `gf2-core` and
# `gf2-sim` by path exactly as an external user would.
#
# The external adapters are feature-gated because each one links a pinned
# external library that `fetch-build.sh` stages outside the repository. The
# build script compiles only the shims whose feature is enabled, so the
# harness still builds on a host that has none of them.

[workspace]

[package]
name = "ldpc-survey-harness"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
# Links the pinned AFF3CT static library; needs GF2_AFF3CT_ROOT.
aff3ct = []

[dependencies]
gf2-coding = { path = "../../../../../crates/gf2-coding" }
tuning-campaign-support = { path = "../../../../tools/tuning-campaign-support" }
gf2-core = { path = "../../../../../crates/gf2-core" }
gf2-sim = { path = "../../../../../crates/gf2-sim", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[build-dependencies]
cc = "1"

[lib]
name = "ldpc_survey"
path = "src/lib.rs"

[[bin]]
name = "ldpc-make-inputs"
path = "src/bin/ldpc-make-inputs.rs"

[[bin]]
name = "ldpc-validate"
path = "src/bin/ldpc-validate.rs"

[[bin]]
name = "gf2-ldpc-arm"
path = "src/bin/gf2-ldpc-arm.rs"

[[bin]]
name = "aff3ct-ldpc-arm"
path = "src/bin/aff3ct-ldpc-arm.rs"
required-features = ["aff3ct"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
