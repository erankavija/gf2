[package]
name = "aff3ct-ldpc-gaps"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gf2-coding = { path = "../../crates/gf2-coding", features = ["tuning-profile"] }
gf2-core = { path = "../../crates/gf2-core", features = ["tuning-profile"] }
gf2-kernels-simd = { path = "../../crates/gf2-kernels-simd" }
tuning-campaign-support.workspace = true
experiments-common = { path = "../common" }
rand_chacha.workspace = true
rand_core.workspace = true
rustix = { version = "1.1", features = ["process", "thread"] }
serde.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
gf2-coding = { path = "../../crates/gf2-coding", features = ["test-support"] }
