[workspace]

[package]
name = "encode-compare-external"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
encode-compare = { path = ".." }
gf2-core = { path = "../../../crates/gf2-core" }
gf2-coding = { path = "../../../crates/gf2-coding" }

[build-dependencies]
cc = "1"

[[bin]]
name = "encode-compare"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
