[package]
name = "permanent-statistics"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Resumable importance sampling for permanental rank"

[dependencies]
experiments-common = { path = "../common" }
gf2-algebra = { path = "../../crates/gf2-algebra" }
gf2-core = { path = "../../crates/gf2-core" }
gf2-sim = { path = "../../crates/gf2-sim" }
gf2-stats = { path = "../../crates/gf2-stats" }
serde = { workspace = true }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
gf2-algebra = { path = "../../crates/gf2-algebra", features = ["test-support"] }
tempfile = "3"
