[package]
name = "permanent-statistics"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Resumable permanent sampling, validation, and exact statistical decisions"

[features]
hip = ["gf2-algebra/hip"]

[dependencies]
rayon = "1"
experiments-common = { path = "../common" }
gf2-algebra = { path = "../../crates/gf2-algebra" }
gf2-core = { path = "../../crates/gf2-core" }
gf2-sim = { path = "../../crates/gf2-sim" }
gf2-stats = { path = "../../crates/gf2-stats" }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
gf2-algebra = { path = "../../crates/gf2-algebra", features = ["test-support"] }
tempfile = "3"
