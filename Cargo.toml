[workspace]
members = [
	"crates/gf2-core",
	"crates/gf2-coding",
	"crates/gf2-algebra",
	"crates/gf2-kernels-simd",
	"crates/gf2-sim",
]
# HIP crate excluded from default workspace — requires ROCm/hipcc.
# Build explicitly: cargo build --manifest-path crates/gf2-kernels-hip/Cargo.toml
#
# `dev/research/f3_bipedal` is a standalone non-workspace prototype with
# its own `[workspace]` table; it is consumed as a path dev-dependency by
# `gf2-kernels-simd` for the b17bec62 SSOT-scalar-reference proptests
# (success criterion 3) and must be excluded here so Cargo does not flag
# it as a nested workspace root when resolving the dev-dep path.
exclude = [
	"crates/gf2-kernels-hip",
	"dev/research/f3_bipedal",
	"dev/research/permanent_gpu_crossover",
]
resolver = "2"

[workspace.dependencies]
criterion = "0.5"
proptest = "1.0"
rand = "0.8"
rand_chacha = "0.9"
rand_core = "0.9"
rayon = "1.10"
trybuild = "1"

[profile.release]
lto = "thin"
codegen-units = 1
