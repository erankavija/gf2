[workspace]
members = [
	"crates/gf2-core",
	"crates/gf2-coding",
	"crates/gf2-kernels-simd",
]
# HIP crate excluded from default workspace — requires ROCm/hipcc.
# Build explicitly: cargo build -p gf2-kernels-hip
exclude = [
	"crates/gf2-kernels-hip",
]
resolver = "2"

[workspace.dependencies]
criterion = "0.5"
proptest = "1.0"
rand = "0.8"
rayon = "1.10"
