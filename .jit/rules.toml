# .jit/rules.toml — the operative source of truth for issue/label validation.
#
# Generated by `jit init`. Custom rules (any `origin` other than "default") are
# fully editable, including the `schemas/*.json` files they reference. The
# built-in rules marked `origin = "default"` are editable for policy (severity,
# enforce, selector), but their assertion is derived from the `[namespaces]` /
# `[type_hierarchy]` registry in `config.toml` in memory at load; the matching
# `schemas/default-*.json` files are regenerated projections for external
# consumers, not the validation authority. Change what a default rule checks by
# editing that registry.

[[rules]]
name = "label-format"
origin = "default"
description = "Every label must match the canonical `namespace:value` format (namespace lowercase-kebab, value non-empty). Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { json-schema = "schemas/default-label-format.json" }

[[rules]]
name = "namespace-registry"
origin = "default"
description = "Every label's namespace must be declared in the namespace registry. An unknown namespace fails validation but never blocks a write."
severity = "error"
enforce = false
assert = { json-schema = "schemas/default-namespace-registry.json" }

[[rules]]
name = "namespace-unique-priority"
origin = "default"
description = "At most one `priority:` label per issue: `priority` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "priority:*", min = 0, max = 1 } }

[[rules]]
name = "namespace-unique-resolution"
origin = "default"
description = "At most one `resolution:` label per issue: `resolution` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "resolution:*", min = 0, max = 1 } }

[[rules]]
name = "namespace-unique-team"
origin = "default"
description = "At most one `team:` label per issue: `team` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "team:*", min = 0, max = 1 } }

[[rules]]
name = "namespace-unique-type"
origin = "default"
description = "At most one `type:` label per issue: `type` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "type:*", min = 0, max = 1 } }

[[rules]]
name = "type-hierarchy-known"
origin = "default"
description = "Every `type:<value>` label must name a type declared in the configured type hierarchy. An unknown type fails validation but never blocks a write."
severity = "error"
enforce = false
assert = { json-schema = "schemas/default-type-hierarchy-known.json" }

[[rules]]
assert = { json-schema = "schemas/jit-content-standards.json" }
description = "Warn when nonterminal work lacks marked, stable success criteria."
enforce = false
name = "jit-content-standards"
origin = "sim-research"
severity = "warn"
when = { state = ["backlog", "ready", "in_progress", "gated"] }

[[rules]]
assert = { label-coverage = { child-link = "dependencies", child-state = "done", child-type-exclude = ["planning", "breakdown"], criteria-section = "success_criteria", id-pattern = "REQ-[0-9]+", marker = "[hard]", satisfies-namespace = "satisfies" } }
description = "Before an epic completes, every hard requirement is credited to a completed implementation descendant."
enforce = true
name = "hard-criteria-covered"
origin = "sim-research"
severity = "error"
when = { state = "done", type = "epic" }

[[rules]]
assert = { label-coverage = { child-link = "dependencies", child-type-exclude = ["breakdown", "planning"], container-from-label = "brackets", criteria-section = "success_criteria", id-pattern = "REQ-[0-9]+", marker = "[hard]", satisfies-namespace = "satisfies" } }
description = "While breakdown is reviewed, every hard requirement is credited to a drafted implementation descendant."
enforce = true
name = "coverage-preview"
origin = "sim-research"
severity = "error"
when = { state = ["in_progress", "gated", "done"], type = "breakdown" }

[[rules]]
assert = { type-hierarchy = { kind = "orphan-leaf" } }
description = "Warn when a leaf-level-typed issue carries no parent-membership label, leaving it unattached to any strategic container. Advisory: never blocks a write."
enforce = false
name = "orphan-leaf"
origin = "sim-research"
severity = "warn"

[[rules]]
assert = { type-hierarchy = { kind = "strategic-consistency" } }
description = "Warn when a strategic-typed issue lacks its own identifying membership label. Advisory: never blocks a write."
enforce = false
name = "strategic-consistency"
origin = "sim-research"
severity = "warn"

[[rules]]
name = "namespace-unique-brackets"
origin = "default"
description = "At most one `brackets:` label per issue: `brackets` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "brackets:*", min = 0, max = 1 } }

[[rules]]
name = "namespace-unique-ppc-kernel"
origin = "default"
description = "At most one `ppc-kernel:` label per issue: `ppc-kernel` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "ppc-kernel:*", min = 0, max = 1 } }
