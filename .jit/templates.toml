[[template]]
anchor_edges = [{ from = "container", to = "breakdown" }]
anchors = [{ gates = ["repo-validate", "doc-review", "holistic-review"], name = "container" }]
applies_to = ["milestone", "epic", "story"]
description = "Plan-before-fan-out bracket with planning and breakdown review."
name = "plan"
nodes = [{ description = "Plan {container.title} ({container.short_id}) against every hard success criterion, write the concise design at {doc} and its authoritative sibling breakdown manifest, and link both to this planning issue.\n\n## Success Criteria\n\n- [hard] REQ-01: The concise plan at {doc} and its authoritative sibling breakdown manifest exist, are linked to this issue, and pass the manifest validation, render check, and batch-create dry run.\n- [hard] REQ-02: The plan-review gate passes on this issue.", doc = "{container.dir}/plan.md", doc_area = "dev/active", gates = ["plan-review"], role = "planning", type = "planning" }, { depends_on = ["planning"], description = "After the plan-review checkpoint passes, decompose the plan for {container.title} ({container.short_id}) into well-ordered implementation issues.\n\n## Success Criteria\n\n- [hard] REQ-01: Every manifest entry exists as exactly one created issue with exact title, description, type, priority, labels, gates, and dependency edges.\n- [hard] REQ-02: The bracket spine is wired: each manifest source depends on this issue, the container depends on each manifest sink, and no direct container anchor to this issue remains.\n- [hard] REQ-03: The coverage-preview and breakdown-review gates pass on this issue.", gates = ["coverage-preview", "breakdown-review"], labels = ["brackets:{container.short_id}"], role = "breakdown", type = "breakdown" }]
transforms = [{ kind = "move-upstream-to-role", role = "planning" }]
