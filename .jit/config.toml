[version]
schema = 2

# =============================================================================
# PROJECT IDENTITY
# =============================================================================
# Canonical, human-editable project name: the `@<project>` scope token in the
# multi-jit addressing scheme. Must match ^[a-z][a-z0-9-]*$. Defaults to a
# slug of this repository's directory name; edit freely.
[project]
name = "gf2"

[type_hierarchy]
types = { milestone = 1, epic = 2, story = 3, planning = 3, breakdown = 3, task = 4, bug = 4, enhancement = 4, simulation = 4 }
strategic_types = ["milestone", "epic"]

[type_hierarchy.label_associations]
milestone = "milestone"
epic = "epic"
story = "story"

[type_hierarchy.icons]
custom = { simulation = "🧪", bug = "🐛" }

[validation]
strictness = "loose"
default_type = "task"

[namespaces]

[namespaces.type]
description = "Issue type (hierarchical). At most one per issue."
examples = ["type:task", "type:simulation", "type:story", "type:epic", "type:milestone"]
unique = true

[namespaces.component]
description = "Technical area or subsystem affected."
examples = ["component:gf2-core", "component:gf2-coding", "component:gf2-algebra", "component:gf2-sim", "component:gf2-kernels-simd", "component:gf2-kernels-hip"]
unique = false

[namespaces.priority]
description = "Work priority. Orthogonal to issue priority field; used for filtering."
examples = ["priority:high", "priority:low"]
unique = true

[namespaces.team]
description = "Owning team."
examples = ["team:backend", "team:platform"]
unique = true

[namespaces.milestone]
description = "Release milestone membership (version tag)."
examples = ["milestone:v1.0", "milestone:v1.2.3", "milestone:v2.0-rc1"]
unique = false

[namespaces.resolution]
description = "Reason for issue closure (used with rejected state)."
examples = ["resolution:wont-fix", "resolution:duplicate", "resolution:obsolete"]
unique = true

[namespaces.enforces]
description = "Enforcement link: names an invariant, rule, or gate item that the labeled issue enforces."
examples = ["enforces:@/invariant/label-format", "enforces:@/rule/label-format", "enforces:@/gate/cargo-ci"]
unique = false

[namespaces.epic]
description = "Epic membership."
examples = ["epic:gf2-sim", "epic:coverage-90"]
unique = false

[namespaces.story]
description = "Story membership (optional)."
examples = ["story:ppc-infrastructure", "story:sota-dense-la"]
unique = false

[namespaces.ppc-kernel]
description = "PPC-spiral kernel ID consumed by the Criterion speedup gate."
examples = ["ppc-kernel:A1", "ppc-kernel:B2", "ppc-kernel:C4", "ppc-kernel:D1"]
unique = true

[namespaces.brackets]
description = "Planning-bracket container pointer: on a breakdown node, names the container it brackets"
examples = ["brackets:0123abcd"]
unique = true

[namespaces.satisfies]
description = "Coverage credit: on an impl child, names a container [hard] criterion id this child CONTRIBUTES to. Several children may credit one id; the label denotes contribution, not sole delivery. Read by the label-coverage gate, which credits a criterion when any labelled child exists."
examples = ["satisfies:REQ-01"]
unique = false

[item_kinds]

[item_kinds.requirement]
id-pattern = "REQ-[0-9]+"
link-namespaces = ["satisfies"]
markers = ["[hard]", "[aspirational]"]
scope = "issue"
section = "success_criteria"
source-of-truth = "markdown-first"

[item_kinds.decision]
id-pattern = "D-[0-9]+"
link-namespaces = ["per"]
markers = []
scope = "issue"
section = "decisions"
source-of-truth = "markdown-first"

[item_kinds.risk]
id-pattern = "RISK-[0-9]+"
link-namespaces = ["mitigates", "resolves"]
markers = []
scope = "issue"
section = "risks"
source-of-truth = "markdown-first"

[item_kinds.invariant]
aliases = ["inv"]
id-pattern = "[a-z][a-z0-9-]*"
link-namespaces = ["enforces"]
markers = []
scope = "project"
section = "success_criteria"
source = { id-field = "id", table = "invariants", text-field = "statement", toml = ".jit/invariants.toml" }
source-of-truth = "registry-first"

[item_kinds.rule]
id-pattern = "[a-z][a-z0-9-]*"
link-namespaces = ["enforces"]
markers = []
scope = "project"
section = "success_criteria"
source = { id-field = "name", table = "rules", text-field = "description", toml = ".jit/rules.toml" }
source-of-truth = "registry-first"

[item_kinds.gate]
id-pattern = "[a-z][a-z0-9-]*"
link-namespaces = ["enforces"]
markers = []
scope = "project"
section = "success_criteria"
source = { id-field = "key", table = "gates", text-field = "description", toml = ".jit/gates.toml" }
source-of-truth = "registry-first"

[documentation]
development_root = "dev"
archive_root = "dev/archive"
managed_paths = ["dev/active", "dev/studies", "dev/sessions", "dev/plans", "dev/presentations", "dev/design", "dev/benchmarks", "dev/experiments"]
permanent_paths = ["docs", "dev/archive", "dev/bench_results", "dev/campaigns", "dev/reference_data", "dev/research", "dev/scripts", "dev/simulation_results"]
issue_scoped_areas = ["dev/active", "dev/studies", "dev/plans", "dev/presentations"]

[projection]

[projection.invariants]
kind = "invariant"
mode = "region"
style = "id-anchor"
target = "AGENTS.md"

[projection.rules-and-gates]
kind = ["rule", "gate"]
mode = "separate-file"
style = "full"
target = ".jit/reference/rules-and-gates.md"
