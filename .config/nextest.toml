# Wrapper scripts hold the host-wide GPU lock (scripts/nextest-gpu-lock.sh).
experimental = ["wrapper-scripts"]

[profile.default]
slow-timeout = { period = "10s", terminate-after = 1 }

# The 15 s fast-tier budget accommodates CPU-bound tests under workspace
# contention. Dropping LTO in `ci-test` favors build parallelism; benchmark
# work continues to use `release`. Two gf2-algebra permanent cross-checks sit
# at the top (bipedal5 and bipedal7 `test_cross_check_n14`) and neither is
# covered by the gf2-sim override below.
#
# Workspace builds and parallel test binaries contend for CPU and accelerator
# resources. The profile gives fast-tier tests room for that contention while
# retaining the fast-tier contract.
[profile.ci]
slow-timeout = { period = "15s", terminate-after = 1 }
fail-fast = false

# The gf2-sim typestate compile-fail guard (issue 81d05bab) uses `trybuild`,
# which spawns a *fresh* `cargo` compile of the wrong-order example to assert it
# fails to compile. Its `.stderr` snapshots are rustc-version-specific, so it is
# now gated behind `RUN_TRYBUILD` and skips by default (CI runs it in a dedicated
# step pinned to the MSRV toolchain — see `.github/workflows/ci.yml`). This
# override is defensive: should it ever run under nextest (RUN_TRYBUILD=1), the
# compiler-spawning invocation needs a realistic timeout; no other test changes.
[[profile.ci.overrides]]
filter = 'test(typestate_rejects_out_of_order_calls)'
slow-timeout = { period = "90s", terminate-after = 1 }

# CPU-bound sim regression guards can starve when the workspace test suite runs
# in parallel. Give these tests a larger per-test ceiling while keeping them in
# the fast tier; every other test keeps the profile budget above.
# (dvb_t2_regression and stage_driven_byte_identity are also
# in the gpu-serial group below; nextest merges the two overrides.)
[[profile.ci.overrides]]
filter = 'package(gf2-sim) and (binary(dvb_t2_regression) or binary(pipeline_run_cpu) or binary(preset_vs_graph_byte_identity) or binary(stage_driven_byte_identity))'
slow-timeout = { period = "20s", terminate-after = 1 }

# GPU-gated tests share one physical gfx1030. nextest runs test binaries in
# parallel, so concurrent GPU tests contend for the device.
# This group serializes the GPU-exercising gf2-sim test binaries so at most
# one GPU job runs at a time. Scheduling only — no per-test timeout changes.
#
# The group serializes within one run. The `gpu-lock` wrapper below serializes
# across runs: every test in `gpu-serial` or `slow-serial` holds one host-wide
# flock while it runs, so test runs from different sessions and worktrees never
# hold HIP queues at once. `slow-serial` holds it because its whole-machine
# tests include GPU legs.
#
# `slow-serial` is the nightly analogue for CPU-bound heavy tests (see
# [profile.slow] below): the sim MODCOD sweeps and the n=28/32 permanent
# cross-checks each want the whole machine, and nextest's default parallelism
# can make them contend with each other and their own rayon pools. Serializing them
# subsumes the GPU constraint for the slow profile, so `gpu-serial` is only used
# by [profile.ci] and the two groups never overlap on a single test.
# `scripts/cargo-ci.sh` runs this profile when BUSY_HOST_OVERRIDE is set: a
# host shared with other sessions' builds and tests kills fast-tier tests at
# the `ci` cap while they pass in isolation. The catch-all override outranks
# the inherited per-binary caps, which are all shorter.
[profile.ci-busy]
inherits = "ci"

[[profile.ci-busy.overrides]]
filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 1 }

[test-groups]
gpu-serial = { max-threads = 1 }
slow-serial = { max-threads = 1 }

[scripts.wrapper.gpu-lock]
command = { command-line = "scripts/nextest-gpu-lock.sh gpu-serial slow-serial --", relative-to = "workspace-root" }
# The lock is taken before a target runner, such as a jobserver token pool, runs.
target-runner = "within-wrapper"

# Every profile inherits `default`. The wrapper reads the test's group from
# NEXTEST_TEST_GROUP, because `group()` is unavailable in script filters.
[[profile.default.scripts]]
filter = 'all()'
run-wrapper = 'gpu-lock'

# Thread budget for the fast tier. `.cargo/config.toml` sets RAYON_NUM_THREADS
# to 4 to bound each test process's pool, and the override below reserves the
# same number of nextest scheduler slots for every test binary that builds one.
# Product per parallel test: 4 slots x 4 rayon threads = 4 CPUs. Scalar tests keep the default
# reservation of one slot and one thread, so they still fill the machine.
#
# The two numbers are one setting expressed in two files, because nextest
# config cannot read the environment. Changing RAYON_NUM_THREADS without
# changing `threads-required` here restores the oversubscription this replaces:
# nproc test binaries each opening an nproc-wide rayon pool, which is what the
# gpu-serial group and the 20 s CPU-smoke overrides above were sized against.
# Those two remain in force; re-measure before narrowing either.
[[profile.ci.overrides]]
filter = '''
    package(gf2-sim) and (
        binary(pipeline_run_cpu) or binary(preset_vs_graph)
        or binary(preset_vs_graph_byte_identity) or binary(determinism)
        or binary(parallel_determinism) or binary(channels_determinism)
        or binary(dvb_t2_regression) or binary(stage_driven_byte_identity)
        or binary(hybrid_scheduler) or binary(executor_oom_fallback_run)
        or binary(batch_decode_worker_determinism)
    )
'''
threads-required = 4

[[profile.ci.overrides]]
filter = 'package(gf2-sim) and (binary(hybrid_resume) or binary(executor_oom_fallback_run) or binary(hybrid_scheduler) or binary(stage_driven_byte_identity) or binary(gpu_byte_identity) or binary(gpu_ldpc_byte_identity) or binary(gpu_demap_byte_identity) or binary(gpu_nr_5g_byte_identity) or binary(dvb_t2_regression))'
test-group = 'gpu-serial'

[profile.slow]
# The slow tier gives long-running integration and cross-check tests a bounded
# whole-machine window. Tests that exceed it, including wall-clock benchmark
# sweeps, are gated behind GF2_BENCH=1 and skip here.
slow-timeout = { period = "600s", terminate-after = 1 }
fail-fast = false

# Everything that wants the whole machine for the duration of one test:
#   * GPU legs — they share ONE physical device, so concurrent long-running legs
#     would bust the cap exactly as they do in the fast tier.
#   * CPU-bound sim sweeps and permanent cross-checks — each drives its own
#     rayon pool (up to 24 workers), so running several at once oversubscribes
#     the runner several times over.
[[profile.slow.overrides]]
filter = '''
    (package(gf2-sim) and (
        binary(hybrid_resume) or binary(executor_oom_fallback_run) or binary(hybrid_scheduler)
        or binary(stage_driven_byte_identity) or binary(gpu_byte_identity)
        or binary(gpu_ldpc_byte_identity) or binary(gpu_demap_byte_identity)
        or binary(gpu_nr_5g_byte_identity) or binary(dvb_t2_regression)
        or binary(determinism) or binary(parallel_determinism)
        or binary(preset_vs_graph_byte_identity)
    ))
    or (package(dvb-t2-awgn) and (binary(campaign_byte_identity) or binary(campaign_cli_flags)))
    or (package(gf2-algebra) and (
        test(test_simd_vs_scalar_n32) or test(test_parallel_cross_check_n28)
    ))
'''
test-group = 'slow-serial'

[[profile.ci.overrides]]
filter = 'package(permanent-statistics) and (binary(campaign_determinism) or binary(campaign_bins))'
threads-required = 4

[[profile.ci.overrides]]
filter = 'package(dvb-t2-awgn) and (binary(campaign_cli_flags) or binary(campaign_byte_identity))'
threads-required = 4

# Calibration probes create dedicated four-worker pools.
[[profile.ci.overrides]]
filter = 'package(tuning-calibration)'
threads-required = 4

# Tests outside the gf2-sim GPU binaries above that open the device. A test
# process's HIP queues count against the device's hardware runlist; concurrent
# HIP processes oversubscribe it, and under oversubscription the gfx1030 faults
# a queue (gfxhub CPF page fault: the process aborts, and a concurrent GPU test
# can stall until its timeout). @/issue/f21b25ac holds the reproduction.
[[profile.ci.overrides]]
filter = '''
    (package(gf2-sim) and kind(lib) and test(/^gpu::/))
    or (package(gf2-sim) and binary(dag_topology) and test(/^gpu::/))
    or (package(gf2-coding) and kind(lib) and test(/::gpu::/))
    or (package(permanent-statistics) and (
        binary(campaign_bins) or binary(campaign_determinism) or binary(campaign_validation)
    ))
'''
test-group = 'gpu-serial'
