# Configured-container plan-before-fan-out bracket. Built-in compatibility presets derive
# their node gate definitions from this template and the gate contributions.
[[contribution]]
kind = "keyed-array"
target = "templates"
identity = "plan"

[contribution.value]
name = "plan"
description = "Plan-before-fan-out bracket with planning and breakdown review."
applies_to = ["milestone", "epic", "story"]

[[contribution.value.anchors]]
name = "container"
gates = ["repo-validate", "doc-review", "holistic-review"]

[[contribution.value.nodes]]
role = "planning"
type = "planning"
gates = ["plan-review"]
doc_area = "dev/active"
doc = "{container.dir}/plan.md"
description = "Plan {container.title} ({container.short_id}) against every hard success criterion, write the concise design at {doc} and its authoritative sibling breakdown manifest, and link both to this planning issue.\n\n## Success Criteria\n\n- [hard] REQ-01: The concise plan at {doc} and its authoritative sibling breakdown manifest exist, are linked to this issue, and pass the manifest validation, render check, and batch-create dry run.\n- [hard] REQ-02: The plan-review gate passes on this issue."

[[contribution.value.nodes]]
role = "breakdown"
type = "breakdown"
gates = ["coverage-preview", "breakdown-review"]
labels = ["brackets:{container.short_id}"]
description = "After the plan-review checkpoint passes, decompose the plan for {container.title} ({container.short_id}) into well-ordered implementation issues.\n\n## Success Criteria\n\n- [hard] REQ-01: Every manifest entry exists as exactly one created issue with exact title, description, type, priority, labels, gates, and dependency edges.\n- [hard] REQ-02: The bracket spine is wired: each manifest source depends on this issue, the container depends on each manifest sink, and no direct container anchor to this issue remains.\n- [hard] REQ-03: The coverage-preview and breakdown-review gates pass on this issue."
depends_on = ["planning"]

[[contribution.value.anchor_edges]]
from = "container"
to = "breakdown"

[[contribution.value.transforms]]
kind = "move-upstream-to-role"
role = "planning"

# The gf2 engineering invariants are profile-owned registry items.

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "canonical-bit-indexing"

[contribution.value]
id = "canonical-bit-indexing"
statement = "Canonical bit index i maps to word i >> 6 and mask 1u64 << (i & 63); conversions preserve this little-endian numbering."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "finite-field-laws"

[contribution.value]
id = "finite-field-laws"
statement = "Every finite-field implementation satisfies the shared field-law conformance suite for its supported domain."
kind = "enforced"
enforced-by = "@/gate/cargo-ci"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "standards-vector-conformance"

[contribution.value]
id = "standards-vector-conformance"
statement = "Standards-based coding and modem behavior is checked against the authoritative standard or a named, versioned vector source; generated fixtures do not replace external conformance evidence."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "backend-behavioral-equivalence"

[contribution.value]
id = "backend-behavioral-equivalence"
statement = "Scalar, SIMD, parallel CPU, and GPU implementations expose equivalent observable results within their declared numerical contract."
kind = "enforced"
enforced-by = "@/gate/cargo-ci"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "single-source-prose"

[contribution.value]
id = "single-source-prose"
statement = "Every fact with a single source of truth reaches prose by projection or citation; volatile facts (counts, enumerations, registry contents) are stated structurally or derived, and a hand-maintained copy is a staleness defect."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "semantic-test-assertions"

[contribution.value]
id = "semantic-test-assertions"
statement = "Tests assert observable semantic properties or relationships; exact field-name inventories and literal-value assertions are confined to one canonical suite for an intentionally stable external contract."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "shared-test-contracts"

[contribution.value]
id = "shared-test-contracts"
statement = "Every implementation of a shared field, codec, modem, pipeline, or kernel interface runs the same behavioral conformance suite; implementation-specific tests cover only implementation-specific behavior."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "accelerator-safe-fallback"

[contribution.value]
id = "accelerator-safe-fallback"
statement = "Unsupported SIMD or GPU capabilities and recoverable accelerator resource failures select a tested safe fallback; fatal kernel or driver failures remain explicit."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "semantic-types"

[contribution.value]
id = "semantic-types"
statement = "Every identity, constrained token, closed vocabulary, and protocol sentinel has one canonical semantic type; raw strings exist only at parsing and serialization boundaries."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "canonical-cutover"

[contribution.value]
id = "canonical-cutover"
statement = "Superseded aliases, fields, and representations are removed after cutover; compatibility code is allowed only in a named, versioned migration boundary with a tracked removal condition."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "unsafe-kernel-isolation"

[contribution.value]
id = "unsafe-kernel-isolation"
statement = "Production unsafe code is isolated to gf2-kernels-simd and gf2-kernels-hip, with explicit safety contracts at every unsafe boundary."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "crate-dependency-direction"

[contribution.value]
id = "crate-dependency-direction"
statement = "Crate dependencies point from domain orchestration toward mathematical primitives and isolated kernels; mathematical, coding-domain, simulation, and kernel layers do not acquire reverse production dependencies."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "deterministic-seeded-execution"

[contribution.value]
id = "deterministic-seeded-execution"
statement = "A fixed seed and configuration produce identical observable results across supported worker counts, scheduling paths, checkpoint/resume boundaries, and accelerator fallbacks."
kind = "enforced"
enforced-by = "@/gate/cargo-ci"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "benchmark-backed-performance"

[contribution.value]
id = "benchmark-backed-performance"
statement = "Performance and crossover claims cite a reproducible benchmark protocol and committed receipt from a suitable uncontended host; estimates are identified as estimates."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "test-tier-budgets"

[contribution.value]
id = "test-tier-budgets"
statement = "Every test respects its tier's configured time budget: release-mode fast-tier tests within the per-test and suite budgets, ignored slow and simulation tests within the nightly budget or through an explicitly serialized or host-gated execution path; slower work carries a descriptive ignore tier."
kind = "enforced"
enforced-by = "@/gate/cargo-ci"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "convention-convergence"

[contribution.value]
id = "convention-convergence"
statement = "A shared convention or abstraction has one form: work that finds it harmful or ill-fitting changes it at its source, or reports the mismatch as a blocking concern before proceeding. A local parallel variant, a private helper duplicating a shared mechanism, or a bypass around an abstraction is a defect unless it is a named, cited exception with a tracked convergence condition."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "present-tense-prose"

[contribution.value]
id = "present-tense-prose"
statement = "Permanent artifacts describe the current state of the system; change-relative narration — old/new contrasts, previously/now framing, legacy markers, migration history — lives in commit messages and issue history."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "library-first-generality"

[contribution.value]
id = "library-first-generality"
statement = "New behavior lands as a reusable API in the layer-appropriate library crate, generic over its natural domain; binaries, simulations, and orchestration stay thin consumers. A capability implemented privately inside a consumer that a library layer could own is a defect unless cited as a tracked exception."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "no-deferred-defects"

[contribution.value]
id = "no-deferred-defects"
statement = "Quality defects surfaced while implementing a change are fixed in that change or filed as a tracked issue before completion; a TODO or FIXME marker without a tracked issue is a defect."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "projection"
name = "invariants"
value = { kind = "invariant", mode = "region", target = "AGENTS.md", style = "id-anchor" }

[[contribution]]
kind = "projection"
name = "rules-and-gates"
value = { kind = ["rule", "gate"], mode = "separate-file", target = ".jit/reference/rules-and-gates.md", style = "full" }

# Install-only adopter state. The invariant registry is not among it:
# initialization creates that registry, and the package contributes its
# invariant entries into it instead of publishing a file over it.
[[asset]]
source = "assets/install/.jit/schemas/jit-content-standards.json"
target = ".jit/schemas/jit-content-standards.json"

[[asset]]
source = "assets/install/.jit/reference/rules-and-gates.md"
target = ".jit/reference/rules-and-gates.md"

# Repository roots the live assets below are drawn from. Each exclusion pattern
# matches a repository-relative path and names a category of repository material
# the package deliberately does not carry, so material of the same shape needs
# no new entry. A tracked file beneath a root that neither an asset packages nor
# a pattern matches fails the suite, so every list here is measured against the
# repository tree rather than maintained by hand.
[[live-source]]
root = ".jit/reference"
exclude = []

[[live-source]]
root = "contrib/gates"
exclude = [
  # The contributed prompt library: worked examples an adopter composes a gate
  # from, rather than prompts this workflow's own gates resolve.
  "contrib/gates/prompts/**",
]

# Live consumers, drawn from the roots declared above. The `assets/live/` source
# prefix is also the renderer's data-owned selection rule; targets remain
# ordinary repository paths.
[[asset]]
source = "assets/live/.jit/reference/content-standards.md"
target = ".jit/reference/content-standards.md"

[[asset]]
source = "assets/live/contrib/gates/ai-review.sh"
target = "contrib/gates/ai-review.sh"
executable = true

[[asset]]
source = "assets/live/contrib/gates/breakdown-review-prompt.md"
target = "contrib/gates/breakdown-review-prompt.md"

[[asset]]
source = "assets/live/contrib/gates/code-review-prompt.md"
target = "contrib/gates/code-review-prompt.md"

[[asset]]
source = "assets/live/contrib/gates/doc-review-prompt.md"
target = "contrib/gates/doc-review-prompt.md"

[[asset]]
source = "assets/live/contrib/gates/holistic-review-prompt.md"
target = "contrib/gates/holistic-review-prompt.md"

[[asset]]
source = "assets/live/contrib/gates/plan-review-prompt.md"
target = "contrib/gates/plan-review-prompt.md"

[[region]]
source = "assets/regions/agents-profile-guidance.md"
target = "AGENTS.md"
region-id = "profile-sim-research-guidance"
placement = "append"
