dependencies = ["jit-default"]

[profile]
manifest-version = 1
id = "sim-research"
version = "1.0.2"
jit = ">=1.0.0, <2.0.0"

# Repository-neutral workflow taxonomy. `jit-default` supplies the shared
# hierarchy and vocabulary; this profile adds bracket and task specialization.

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "planning"
value = 3

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "breakdown"
value = 3

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "bug"
value = 4

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "enhancement"
value = 4

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "simulation"
value = 4

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "epic"
value = { description = "Epic membership.", unique = false, examples = ["epic:gf2-sim", "epic:coverage-90"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "story"
value = { description = "Story membership (optional).", unique = false, examples = ["story:ppc-infrastructure", "story:sota-dense-la"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "ppc-kernel"
value = { description = "PPC-spiral kernel ID consumed by the Criterion speedup gate.", unique = true, examples = ["ppc-kernel:A1", "ppc-kernel:B2", "ppc-kernel:C4", "ppc-kernel:D1"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "brackets"
value = { description = "Planning-bracket container pointer: on a breakdown node, names the container it brackets", unique = true, examples = ["brackets:0123abcd"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "satisfies"
value = { description = "Coverage credit: on an impl child, names a container [hard] criterion id this child CONTRIBUTES to. Several children may credit one id; the label denotes contribution, not sole delivery. Read by the label-coverage gate, which credits a criterion when any labelled child exists.", unique = false, examples = ["satisfies:REQ-01"] }

# Advisory authoring structure plus enforced plan-time and completion coverage.
[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "jit-content-standards"

[contribution.value]
name = "jit-content-standards"
origin = "sim-research"
description = "Warn when nonterminal work lacks marked, stable success criteria."
severity = "warn"
enforce = false
when = { state = ["backlog", "ready", "in_progress", "gated"] }
assert = { json-schema = "schemas/jit-content-standards.json" }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "hard-criteria-covered"

[contribution.value]
name = "hard-criteria-covered"
origin = "sim-research"
description = "Before an epic completes, every hard requirement is credited to a completed implementation descendant."
when = { type = "epic", state = "done" }
severity = "error"
enforce = true
assert = { label-coverage = { criteria-section = "success_criteria", marker = "[hard]", id-pattern = "REQ-[0-9]+", satisfies-namespace = "satisfies", child-state = "done", child-link = "dependencies", child-type-exclude = ["planning", "breakdown"] } }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "coverage-preview"

[contribution.value]
name = "coverage-preview"
origin = "sim-research"
description = "While breakdown is reviewed, every hard requirement is credited to a drafted implementation descendant."
when = { type = "breakdown", state = ["in_progress", "gated", "done"] }
severity = "error"
enforce = true
assert = { label-coverage = { criteria-section = "success_criteria", marker = "[hard]", id-pattern = "REQ-[0-9]+", satisfies-namespace = "satisfies", container-from-label = "brackets", child-link = "dependencies", child-type-exclude = ["breakdown", "planning"] } }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "orphan-leaf"

[contribution.value]
name = "orphan-leaf"
origin = "sim-research"
description = "Warn when a leaf-level-typed issue carries no parent-membership label, leaving it unattached to any strategic container. Advisory: never blocks a write."
severity = "warn"
enforce = false
assert = { type-hierarchy = { kind = "orphan-leaf" } }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "strategic-consistency"

[contribution.value]
name = "strategic-consistency"
origin = "sim-research"
description = "Warn when a strategic-typed issue lacks its own identifying membership label. Advisory: never blocks a write."
severity = "warn"
enforce = false
assert = { type-hierarchy = { kind = "strategic-consistency" } }

