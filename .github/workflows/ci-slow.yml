name: Slow tests (nightly)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  slow:
    name: Slow / simulation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ubuntu-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ubuntu-cargo-build-slow-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Run slow / simulation tests
      run: cargo nextest run --workspace --features simd,parallel,visualization,io,rand,llr-f64 --release --profile slow --run-ignored ignored-only
