name: Slow tests (nightly)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  slow:
    name: Slow / simulation tests
    runs-on: ubuntu-latest
    # The heavy legs run serialized (see the `slow-serial` test group in
    # .config/nextest.toml), so wall-clock is dominated by them running back to
    # back rather than by the widest parallel batch. ~50 min nominal.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ubuntu-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ubuntu-cargo-build-slow-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Run slow / simulation tests
      # No exclusion list. Tests structurally beyond this job's reach stand down
      # by themselves and print `SKIP <name>: <reason>`:
      #   * host-local data (ETSI DVB-T2 vectors, the precomputed generator
      #     cache) — skipped when the tree is absent, which it is here;
      #   * benchmark-grade tests (wall-clock assertions, multi-minute RREF
      #     preprocessing) — skipped unless GF2_BENCH=1, which this job does not
      #     set. Run them on a quiesced host instead.
      # A name-based filter here would rot as tests are added; the gates live
      # with the tests. See crates/gf2-coding/tests/common/mod.rs.
      run: >
        cargo nextest run --workspace --features simd,parallel,visualization,io,rand,llr-f64
        --release --profile slow --run-ignored ignored-only

  kani-heavy:
    name: Kani Verification (heavy GF(256) harnesses)
    runs-on: ubuntu-latest
    # The three GF(256) table harnesses each take ~6-7 min of CBMC solving and
    # are too memory-heavy to run alongside the rest on the blocking CI runner
    # (.github/workflows/ci.yml runs everything else). Verify them here nightly,
    # sequentially, so peak memory stays at one harness. ~20 min nominal; ceiling
    # has wide margin for slow runners (CBMC times vary ~2.5x by runner).
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    # Kani's bundled rustc lags the project MSRV (1.95); relax `rust-version`
    # for this CI-only checkout so the rust-version gate does not block. See the
    # matching step in .github/workflows/ci.yml.
    - name: Relax MSRV for Kani's bundled toolchain (CI-only)
      run: |
        find crates dev/research -name Cargo.toml \
          -exec sed -i 's/^rust-version = .*/rust-version = "1.80"/' {} +

    - name: Kani verification (GF(256) tables)
      uses: model-checking/kani-github-action@v1
      with:
        kani-version: '0.66.0'
        # `gf256` matches the three table_*_gf256 harnesses only.
        args: -p gf2-core --harness gf256
