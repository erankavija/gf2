name: CI

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ubuntu-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ubuntu-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ubuntu-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --features simd,parallel,visualization,io,rand,llr-f64 -- -D warnings

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Build
      run: cargo build --workspace --release --verbose --features simd,parallel,visualization,io,rand,llr-f64

    - name: Run tests
      run: cargo nextest run --workspace --release --features simd,parallel,visualization,io,rand,llr-f64 --profile ci

    - name: Build documentation
      run: cargo doc --workspace --release --no-deps --features simd,parallel,visualization,io,rand,llr-f64

    - name: Build benchmarks
      run: cargo build --workspace --release --benches

  coverage:
    name: Coverage Badges
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ubuntu-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ubuntu-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage data
      run: cargo llvm-cov --features simd,parallel,visualization,io,rand,llr-f64 --workspace --json --summary-only --output-path coverage.json

    - name: Generate coverage badges
      run: bash scripts/generate-coverage-badges.sh coverage.json badges

    - name: Deploy badges to badges branch
      run: |
        cd badges
        git init
        git checkout -b badges
        git add -A
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -m "Update coverage badges [skip ci]"
        git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  kani:
    name: Kani Verification
    runs-on: ubuntu-latest
    # Blocking gate runs the lighter harnesses only. The three GF(256) table
    # harnesses (table_{consistency,inverse_correct,mul_matches_schoolbook}_gf256)
    # each take ~6-7 min and ~GBs of CBMC memory; running them alongside the
    # rest OOM-killed/preempted the free runner. They are exhaustively verified
    # nightly instead (see .github/workflows/ci-slow.yml, harness filter
    # `gf256`). The 22 lighter harnesses take ~32 min and run cleanly (no OOM);
    # the ceiling has margin for slow runners (CBMC times vary ~2.5x by runner).
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    # Kani ships its own (lagging) bundled rustc. After the MSRV bump to 1.95
    # (2026-04-27) cargo hard-errors that Kani's toolchain is too old, and
    # current cargo-kani has no `--ignore-rust-version` passthrough (its cargo
    # arg set is a fixed allowlist). Relax `rust-version` for THIS CI job only
    # (the checkout is ephemeral; the committed MSRV is unchanged) so the
    # rust-version gate does not block the model-checking harnesses.
    - name: Relax MSRV for Kani's bundled toolchain (CI-only)
      run: |
        find crates dev/research -name Cargo.toml \
          -exec sed -i 's/^rust-version = .*/rust-version = "1.80"/' {} +

    - name: Kani verification
      uses: model-checking/kani-github-action@v1
      with:
        kani-version: '0.66.0'
        # Run every harness EXCEPT the three heavy GF(256) ones (verified
        # nightly). `--harness` is an OR-matched substring filter, repeatable:
        # `bitvec` (15) + `gf16` (3) + `kernels::ops` (4) = all 22 lighter
        # harnesses. Sequential (no -j) keeps peak CBMC memory to one harness.
        args: -p gf2-core --harness bitvec --harness gf16 --harness kernels::ops

  lean-verify:
    name: Lean Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install Lean4 (elan)
      run: |
        curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install Rust nightly (for Charon)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-02-22
        components: rustc-dev, llvm-tools-preview, rust-src, miri

    - name: Cache Charon binary
      id: cache-charon
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/charon*
        key: charon-patched-e069223a-${{ hashFiles('patches/charon-e069223a-assoc-type-fixes.patch') }}

    - name: Install Charon (patched)
      if: steps.cache-charon.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/AeneasVerif/charon.git /tmp/charon
        cd /tmp/charon
        git checkout e069223a
        git apply $GITHUB_WORKSPACE/patches/charon-e069223a-assoc-type-fixes.patch
        cd charon
        cargo +nightly-2026-02-22 install --path . --locked

    - name: Install OCaml and Aeneas
      run: |
        sudo apt-get update && sudo apt-get install -y opam
        opam init --disable-sandboxing --no-setup --auto-setup --yes
        opam switch create 5.2.1
        eval $(opam env)
        opam install ppx_deriving visitors easy_logging zarith yojson core_unix \
          odoc ocamlgraph menhir unionFind zarith progress domainslib dune --yes
        git clone https://github.com/AeneasVerif/aeneas.git /tmp/aeneas
        cd /tmp/aeneas
        git checkout 0f99a049
        make setup-charon && make build-dev
        cp /tmp/aeneas/bin/aeneas ~/.cargo/bin/

    - name: Cache Lake build
      uses: actions/cache@v4
      with:
        path: proofs/.lake
        key: lean-lake-${{ hashFiles('proofs/lean-toolchain', 'proofs/lakefile.lean') }}

    - name: Run verification pipeline
      run: |
        eval $(opam env)
        AENEAS_LEAN_DIR=/tmp/aeneas/backends/lean ./scripts/verify-lean.sh

    - name: Verify hand-written proof files are up to date
      run: |
        git diff --exit-code proofs/Gf2Core/Proofs/ proofs/Gf2Core/FunsExternal.lean || {
          echo "ERROR: Hand-written proof files were modified by the pipeline."
          echo "This means committed proofs don't match the generated code."
          echo "Run ./scripts/verify-lean.sh locally and commit the updated files."
          exit 1
        }
