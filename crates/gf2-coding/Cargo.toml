[package]
name = "gf2-coding"
version = "0.1.0"
edition = "2021"
authors = ["Vesa Kaskivuo <vesa.kaskivuo@iki.fi>"]
description = "Error-correcting code constructions and compression research built on gf2-core"
license = "MIT"
keywords = ["coding-theory", "compression", "gf2"]
categories = ["algorithms", "encoding", "mathematics"]
rust-version = "1.95"

[dependencies]
gf2-core = { path = "../gf2-core" }
gf2-kernels-simd = { path = "../gf2-kernels-simd" }
gf2-kernels-hip = { path = "../gf2-kernels-hip", optional = true }
rand = { workspace = true }
rand_distr = "0.4"
rayon = { workspace = true, optional = true }
once_cell = "1.19"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
criterion = { workspace = true }
tempfile = "3.8"
thiserror = "1.0"
num_cpus = "1.17.0"
# SVG plot generation for the d4851c3d presentation figures example only.
# Default-features disabled: we only need the SVG backend, not the bitmap
# / font backends, which keeps the build lean.
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "histogram"] }

[features]
default = ["simd"]
simd = ["gf2-core/simd"]
parallel = ["dep:rayon", "gf2-core/parallel"]
visualization = ["gf2-core/visualization"]
# Use f64 precision for LLRs instead of f32 (slower, for research/comparison)
llr-f64 = []
# HIP/ROCm GPU acceleration (requires hipcc and AMD GPU)
hip = ["dep:gf2-kernels-hip"]
# Bench-csv emitter support (jit:47698404). Pulls in `gf2-core/test-support`
# which exposes the `bench_seed` module used by the sparse CSV harness.
bench-csv = ["gf2-core/test-support"]

# Binaries are auto-discovered in src/bin/
# - generate_ldpc_cache: Generate DVB-T2 LDPC encoding cache files
# - validate_ldpc_cache: Comprehensive LDPC validation with error correction
# - check_encoding: Quick encoding sanity check

# Sparse-side CSV emitter for the post-PPC scorecard (jit:47698404).
# Mirrors the dense emitter's example layout in `crates/gf2-core/examples/`.
[[example]]
name = "bench_sparse_csv_emitter"
required-features = ["bench-csv"]

# Sparse-smoke ground-truth emitter (jit:96fde7c7). Emits the binary
# `benchmarks/expected/sparse_smoke_n16.bin` consumed by the C++
# `benchmarks/reference/sparse_smoke.cpp` cross-equality oracle. Same
# `bench-csv` gate as the CSV emitter so both share the
# `gf2-core/test-support` (bench_seed module) dependency.
[[example]]
name = "sparse_smoke_emit_expected"
required-features = ["bench-csv"]

[[bench]]
name = "linear_codes"
harness = false

[[bench]]
name = "sparse_preprocessing"
harness = false

[[bench]]
name = "ldpc_throughput"
harness = false

[[bench]]
name = "profile_ldpc_encode"
harness = false

[[bench]]
name = "profile_ldpc_decode"
harness = false

[[bench]]
name = "batch_operations"
harness = false

[[bench]]
name = "quick_parallel"
harness = false

[[bench]]
name = "bch_parallel"
harness = false

[[bench]]
name = "ldpc_decode"
harness = false

[[bench]]
name = "llr_simd"
harness = false

[[bench]]
name = "allocation_optimization"
harness = false

[[bench]]
name = "modem_cpu"
harness = false

[[bench]]
name = "cpu_dispatch_probe"
harness = false

[[bench]]
name = "modem_generic_vs_fast"
harness = false

[[bench]]
name = "simulation_no_analysis_overhead"
harness = false
