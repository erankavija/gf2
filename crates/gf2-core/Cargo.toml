[package]
name = "gf2-core"
version = "0.1.0"
edition = "2021"
authors = ["Vesa Kaskivuo <vesa.kaskivuo@iki.fi>"]
description = "High-performance bit string manipulation primitives over GF(2)"
license = "MIT"
keywords = ["bitset", "gf2", "bitvec", "galois-field"]
categories = ["algorithms", "data-structures", "mathematics", "no-std"]
rust-version = "1.95"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verify_lean)'] }

[dependencies]
# Non-optional: hosts the SSOT scalar `clmul_u64_scalar` that
# `gf2m::barrett::clmul` delegates to. The SIMD feature now only gates
# whether runtime detection wires up the accelerated kernel bundles.
gf2-kernels-simd = { path = "../gf2-kernels-simd" }
rand = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# Only pulled in when the `test-support` feature is enabled.
proptest = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
gf2-core = { path = ".", features = ["test-support"] }
proptest = { workspace = true }
rand = { workspace = true }
# Test-only: serialises #[test] functions that read process-wide atomic
# counters in `field::expr`. Required for correctness under `cargo test`
# (in-process parallel); `cargo nextest` runs each test in a subprocess
# and does not strictly need this, but tagging keeps both runners honest.
serial_test = "3"

[features]
default = ["rand", "io"]
# Opt-in to SIMD accelerated kernels. The `gf2-kernels-simd` crate is
# always linked (it hosts the scalar `clmul_u64_scalar` SSOT); this
# feature only gates the runtime detection / kernel dispatch paths.
simd = []
# Random generation functions (enabled by default for testing/examples).
rand = ["dep:rand"]
# Parallel algorithms with rayon
parallel = ["dep:rayon"]
# Matrix visualization to PNG images.
visualization = ["image"]
# File I/O support
io = ["dep:serde", "dep:serde_json"]
# Exposes the canonical field axiom test harness (`field::axiom_tests`) to
# integration tests, benchmarks, and downstream crates. Off by default; gets
# auto-enabled under `cargo test` via the self-dev-dependency above.
test-support = ["dep:proptest"]

