[package]
name = "gf2-sim"
version = "0.1.0"
edition = "2021"
authors = ["Vesa Kaskivuo <vesa.kaskivuo@iki.fi>"]
description = "Research-grade CPU+GPU FEC simulation pipeline (Pipeline/Stage/Connector) built on gf2-coding"
license = "MIT"
keywords = ["coding-theory", "simulation", "pipeline", "gf2"]
categories = ["algorithms", "simulation", "mathematics"]
rust-version = "1.95"

# Dependency block per pipeline design doc (ec530af9) §5 "Crate-boundary diagram".
[dependencies]
gf2-core = { path = "../gf2-core" }
gf2-coding = { path = "../gf2-coding" }
gf2-kernels-hip = { path = "../gf2-kernels-hip", optional = true }
rayon = "1"
rand_chacha = "0.9" # Q1 decision: future-aligned
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0" # v2 checkpoint (de)serialisation
ctrlc = "3" # for SIGINT handler in 5f12e7ff
blake3 = "1" # for v2 checkpoint config_hash

[dev-dependencies]
proptest = { workspace = true }
trybuild = { workspace = true }
rayon = "1"
serde_json = "1.0" # for tracing.jsonl JSON validation in campaign_cli_flags tests
# Self-dev-dependency exposing the `test-support` feature so integration
# tests and benches can use `gf2_sim::testutil::AwgnLlrSource` — the SSOT
# for the deterministic SplitMix64 + Box-Muller AWGN channel-LLR source
# (review F3, jit:23d3525f). Mirrors the `gf2-algebra` pattern (see
# `crates/gf2-algebra/Cargo.toml`).
gf2-sim = { path = ".", features = ["test-support"] }

[features]
default = []
hip = ["dep:gf2-kernels-hip"]
llr-f64 = ["gf2-coding/llr-f64"]

# Exposes the canonical test/bench-only deterministic AWGN channel-LLR source
# (`testutil::AwgnLlrSource`) to integration tests, benches, and the GPU
# throughput bins. Off by default; auto-enabled for this crate's own tests and
# benches via the self-dev-dependency above. Mirrors `gf2-algebra`'s
# `test-support`.
test-support = []

# GPU LDPC decode-stage throughput bin (issue a930be7f receipt). A normal
# (non-dev) target, so the self-dev-dependency does NOT auto-enable
# `test-support` for it — it must be requested explicitly:
#   cargo run -p gf2-sim --release --features hip,test-support \
#       --bin gpu_ldpc_throughput -- ...
[[bin]]
name = "gpu_ldpc_throughput"
required-features = ["test-support"]

# LDPC-only AWGN-BPSK BLER sweep for the external-library comparison harness
# (issue 18e69a1a). Uses `testutil::AwgnLlrSource` and the shared
# `testutil::ComparisonCode` selection, so it requires the `test-support`
# feature explicitly:
#   cargo run -p gf2-sim --release --features test-support \
#       --bin ldpc_bler_sweep -- --code dvb-t2-r12 ...
[[bin]]
name = "ldpc_bler_sweep"
required-features = ["test-support"]

# AList H-matrix export for the same comparison harness (issue 18e69a1a).
# Shares `testutil::ComparisonCode` with ldpc_bler_sweep (the SSOT code
# selection), so it also requires `test-support`:
#   cargo run -p gf2-sim --release --features test-support \
#       --bin export_alist -- --code dvb-t2-r12 --output dvb_t2_r12.alist
[[bin]]
name = "export_alist"
required-features = ["test-support"]

# Researcher-onboarding GPU hybrid example (issue 110e45cc): the same DVB-T2
# chain on the CPU+GPU path vs CPU-only, asserting the design-doc §11
# CPU-vs-GPU three-column byte-identity. Requires a gfx1030 device; skips
# gracefully when none is present. Compiled only under `--features hip`:
#   cargo run -p gf2-sim --example gpu_hybrid --features hip --release
[[example]]
name = "gpu_hybrid"
required-features = ["hip"]

# 5G NR LDPC GPU real-time decode-rate tuning sweep (issue 23d3525f). Custom
# main (harness = false): a BLER + decoded-throughput cell sweep, not a
# Criterion micro-benchmark. Builds on non-ROCm hosts (no-hip is a no-op main);
# the GPU sweep requires `--features hip` and a gfx1030 device.
[[bench]]
name = "nr_5g_realtime"
harness = false
