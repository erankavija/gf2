[package]
name = "gf2-kernels-hip"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "HIP/ROCm GPU kernels for gf2 — BCJR batch decoder"
publish = false

[dependencies]
gf2-core = { path = "../gf2-core" }

[build-dependencies]
cc = "1"

[dev-dependencies]
gf2-coding = { path = "../gf2-coding", features = ["hip"] }
proptest = "1.0"
