[workspace]

[package]
name = "gf2-kernels-hip"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "HIP/ROCm GPU kernels for gf2 — BCJR batch decoder"
publish = false

[features]
# Enable per-prime permanent kernels (permanent_bipedal{3,5,7}).
# Requires hipcc and a compatible AMD GPU (gfx1030).
hip = []

[dependencies]
gf2-core = { path = "../gf2-core" }
tracing = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
gf2-algebra = { path = "../gf2-algebra" }
gf2-coding = { path = "../gf2-coding", features = ["hip"] }
proptest = "1.0"
criterion = "0.5"
# Host-side oracle for the GPU ChaCha20 byte-identity test (matches the
# `gf2-sim` parallel module's pin): rand_chacha 0.9 `set_word_pos` + rand 0.9
# `f64` sampling reproduce the exact word stream the device kernel must match.
rand = "0.9"
rand_chacha = "0.9"

[[bench]]
name = "gpu_vs_cpu_gray_qam"
harness = false
